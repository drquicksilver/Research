<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2D rigid body demo</title>
<style>
:root {
  --accent: #79c7ff;
  --bg: #12151c;
  --panel: #191d26;
  --line: #262c39;
  --text: #dce4f2;
  --muted: #8b95a8;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; overflow: hidden;
}
#stage { flex: 1 1 auto; position: relative; min-width: 0; }
#view { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#view:active { cursor: grabbing; }
#overlay {
  position: absolute; left: 14px; top: 12px; pointer-events: none;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}
#overlay h1 { margin: 0; font-size: 15px; letter-spacing: 0.02em; color: var(--accent); }
#overlay p { margin: 3px 0 0; max-width: 46ch; color: var(--muted); font-size: 12px; }
#panel {
  flex: 0 0 302px; background: var(--panel); border-left: 1px solid var(--line);
  padding: 14px 14px 22px; overflow-y: auto;
}
#panel h2 {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.09em;
  color: var(--muted); margin: 18px 0 8px; font-weight: 600;
}
#panel h2:first-child { margin-top: 0; }
select, button {
  font: inherit; color: var(--text); background: #222836;
  border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px;
}
button { cursor: pointer; }
button:hover { background: #2b3242; }
select { width: 100%; }
.buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
.buttons .wide { grid-column: 1 / -1; }
.ctl { display: block; margin-bottom: 9px; font-size: 12px; }
.ctl input[type=range] { width: 100%; accent-color: var(--accent); margin: 2px 0 0; }
.ctl input[type=checkbox] { accent-color: var(--accent); margin-right: 7px; vertical-align: -1px; }
.ctl-head { display: flex; justify-content: space-between; color: var(--muted); }
.ctl-head b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
#hud .row {
  display: flex; justify-content: space-between; gap: 8px;
  font-size: 11.5px; padding: 1.5px 0; color: var(--muted);
}
#hud .row b {
  color: var(--text); font-weight: 500;
  font-family: ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums;
}
canvas.strip { width: 100%; height: 40px; display: block; margin-bottom: 5px; border-radius: 3px; }
.hint { color: var(--muted); font-size: 11px; margin: 10px 0 0; }
.hint kbd {
  background: #222836; border: 1px solid var(--line); border-radius: 3px;
  padding: 0 4px; font-family: inherit; font-size: 10.5px;
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="overlay">
    <h1><span id="engine-name"></span></h1>
    <p id="scene-blurb"></p>
  </div>
</div>
<aside id="panel">
  <h2>Scene</h2>
  <select id="scene"></select>
  <div class="buttons">
    <button id="btn-play">Pause</button>
    <button id="btn-step">Step</button>
    <button id="btn-reset">Reset</button>
    <select id="speed" title="Simulation rate">
      <option value="1">1x speed</option>
      <option value="0.25">0.25x</option>
      <option value="0.1">0.1x</option>
      <option value="2">2x</option>
    </select>
    <button id="btn-perturb" class="wide">Perturb</button>
  </div>

  <h2>Solver — sequential impulses</h2>
  <div id="params"></div>

  <h2>Debug draw</h2>
  <div id="debug"></div>

  <h2>Measurements</h2>
  <div id="hud"></div>
  <canvas class="strip" id="strip-pen"></canvas>
  <canvas class="strip" id="strip-energy"></canvas>
  <canvas class="strip" id="strip-cost"></canvas>

  <p class="hint">
    Drag bodies with the mouse. <kbd>Alt</kbd>+click spawns a box,
    <kbd>Alt</kbd>+<kbd>Ctrl</kbd>+click a ball. <kbd>Shift</kbd>+drag pans,
    scroll zooms. <kbd>Space</kbd> pause, <kbd>.</kbd> single step,
    <kbd>R</kbd> reset, <kbd>P</kbd> perturb.
  </p>
</aside>
<script>
(function () {
"use strict";
// ===== src/core/math.js =====
// Small 2D math helpers shared by both engines.
// Vectors are plain {x, y} objects. The hot solver loops use raw scalars rather
// than these helpers so we never allocate inside a step.

const EPS = 1e-12;

function v2(x = 0, y = 0) { return { x, y }; }
function add(a, b) { return { x: a.x + b.x, y: a.y + b.y }; }
function sub(a, b) { return { x: a.x - b.x, y: a.y - b.y }; }
function mul(a, s) { return { x: a.x * s, y: a.y * s }; }
function neg(a) { return { x: -a.x, y: -a.y }; }
function dot(a, b) { return a.x * b.x + a.y * b.y; }
// 2D "cross product": the z component of the 3D cross of two in-plane vectors.
function cross(a, b) { return a.x * b.y - a.y * b.x; }
// cross(scalar w, vector v) -> vector, i.e. w x v
function crossSV(s, v) { return { x: -s * v.y, y: s * v.x }; }
// cross(vector v, scalar w) -> vector
function crossVS(v, s) { return { x: s * v.y, y: -s * v.x }; }
function len(a) { return Math.hypot(a.x, a.y); }
function lenSq(a) { return a.x * a.x + a.y * a.y; }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

function normalize(a) {
  const l = Math.hypot(a.x, a.y);
  if (l < EPS) return { x: 0, y: 0 };
  return { x: a.x / l, y: a.y / l };
}

function clamp(x, lo, hi) { return x < lo ? lo : (x > hi ? hi : x); }

/** Rotate v by angle (radians). */
function rotate(v, a) {
  const c = Math.cos(a), s = Math.sin(a);
  return { x: c * v.x - s * v.y, y: s * v.x + c * v.y };
}

/** Rotate v by -angle. */
function rotateT(v, a) {
  const c = Math.cos(a), s = Math.sin(a);
  return { x: c * v.x + s * v.y, y: -s * v.x + c * v.y };
}

/** Body-local point -> world point. */
function toWorld(body, p) {
  const c = Math.cos(body.angle), s = Math.sin(body.angle);
  return {
    x: body.position.x + c * p.x - s * p.y,
    y: body.position.y + s * p.x + c * p.y,
  };
}

/** World point -> body-local point. */
function toLocal(body, p) {
  const c = Math.cos(body.angle), s = Math.sin(body.angle);
  const dx = p.x - body.position.x, dy = p.y - body.position.y;
  return { x: c * dx + s * dy, y: -s * dx + c * dy };
}

/** Deterministic 32-bit LCG. Both engines must see identical scene noise. */
class Rng {
  constructor(seed = 1) { this.s = (seed >>> 0) || 1; }
  next() {
    // Numerical Recipes LCG constants; exact in float64.
    this.s = (Math.imul(this.s, 1664525) + 1013904223) >>> 0;
    return this.s / 4294967296;
  }
  /** Uniform in [-a, a]. */
  sym(a) { return (this.next() * 2 - 1) * a; }
  range(lo, hi) { return lo + this.next() * (hi - lo); }
}

// ===== src/core/body.js =====
// Rigid bodies and convex shapes. Shared verbatim by both engines so that any
// behavioural difference between them is attributable to the solver alone.

const STATIC = 0;
const DYNAMIC = 1;

let nextBodyId = 1;
function resetBodyIds() { nextBodyId = 1; }

/**
 * Convex polygon shape. Vertices must be counter-clockwise. They are recentred
 * on the centroid so that body.position is always the centre of mass, which
 * keeps the inertia terms in the solver simple (no offset coupling).
 */
function polygonShape(verts) {
  const n = verts.length;
  if (n < 3) throw new Error('polygon needs >= 3 vertices');

  // Signed area and centroid via the standard triangle fan decomposition.
  let area = 0, cx = 0, cy = 0;
  for (let i = 0; i < n; i++) {
    const p = verts[i], q = verts[(i + 1) % n];
    const a = p.x * q.y - q.x * p.y;
    area += a;
    cx += (p.x + q.x) * a;
    cy += (p.y + q.y) * a;
  }
  area *= 0.5;
  if (area < 0) throw new Error('polygon vertices must be counter-clockwise');
  cx /= (6 * area);
  cy /= (6 * area);

  const local = verts.map((p) => v2(p.x - cx, p.y - cy));

  // Second moment of area about the centroid (per unit density).
  let num = 0, den = 0;
  for (let i = 0; i < n; i++) {
    const p = local[i], q = local[(i + 1) % n];
    const c = p.x * q.y - q.x * p.y;
    num += c * ((p.x * p.x + p.x * q.x + q.x * q.x) + (p.y * p.y + p.y * q.y + q.y * q.y));
    den += c;
  }
  const inertiaPerArea = num / (6 * den);

  // Outward face normals, normal[i] belongs to edge local[i] -> local[i+1].
  const normals = [];
  for (let i = 0; i < n; i++) {
    const p = local[i], q = local[(i + 1) % n];
    const ex = q.x - p.x, ey = q.y - p.y;
    const l = Math.hypot(ex, ey);
    if (l < EPS) throw new Error('degenerate polygon edge');
    normals.push(v2(ey / l, -ex / l));
  }

  let radius = 0;
  for (const p of local) radius = Math.max(radius, Math.hypot(p.x, p.y));

  return { type: 'poly', verts: local, normals, area, inertiaPerArea, radius, centroid: v2(cx, cy) };
}

function boxShape(hw, hh) {
  return polygonShape([v2(-hw, -hh), v2(hw, -hh), v2(hw, hh), v2(-hw, hh)]);
}

function circleShape(r) {
  return { type: 'circle', verts: null, normals: null, area: Math.PI * r * r, inertiaPerArea: 0.5 * r * r, radius: r, centroid: v2(0, 0) };
}

class Body {
  constructor(opts = {}) {
    this.id = nextBodyId++;
    this.shape = opts.shape;
    this.type = opts.type === STATIC || opts.static ? STATIC : DYNAMIC;

    this.position = v2(opts.x || 0, opts.y || 0);
    this.angle = opts.angle || 0;
    this.linearVelocity = v2(opts.vx || 0, opts.vy || 0);
    this.angularVelocity = opts.w || 0;

    this.density = opts.density != null ? opts.density : 1;
    this.friction = opts.friction != null ? opts.friction : 0.5;
    // Static friction defaults to the dynamic value. The XPBD engine uses both;
    // the sequential-impulse engine uses a single Coulomb cone as is standard.
    this.staticFriction = opts.staticFriction != null ? opts.staticFriction : this.friction;
    this.restitution = opts.restitution != null ? opts.restitution : 0;

    this.color = opts.color || null;
    this.label = opts.label || null;
    // Bodies flagged `tracked` are watched by the metrics code (e.g. tower apex).
    this.tracked = !!opts.tracked;

    if (this.type === STATIC) {
      this.mass = 0; this.invMass = 0; this.inertia = 0; this.invInertia = 0;
    } else {
      this.mass = this.shape.area * this.density;
      this.invMass = 1 / this.mass;
      this.inertia = this.mass * this.shape.inertiaPerArea;
      this.invInertia = this.inertia > 0 ? 1 / this.inertia : 0;
      if (opts.fixedRotation) { this.inertia = 0; this.invInertia = 0; }
    }

    // Force accumulator, cleared every step.
    this.force = v2(0, 0);
    this.torque = 0;

    // Cached world-space geometry, refreshed by updateTransform().
    this.worldVerts = this.shape.type === 'poly' ? this.shape.verts.map(() => v2()) : null;
    this.worldNormals = this.shape.type === 'poly' ? this.shape.normals.map(() => v2()) : null;
    this.aabb = { minX: 0, minY: 0, maxX: 0, maxY: 0 };
    this.sin = 0; this.cos = 1;

    // Sleep bookkeeping (used identically by both engines).
    this.sleepTime = 0;
    this.sleeping = false;

    // Previous pose, used by the XPBD integrator for velocity recovery and for
    // measuring per-substep tangential slip. It must start at the *current*
    // pose: static bodies are never touched by the integrator, and a zeroed
    // prevPose would make every static contact look like it had slid metres.
    this.prevPosition = v2(this.position.x, this.position.y);
    this.prevAngle = this.angle;

    this.updateTransform();
    this.initialPosition = v2(this.position.x, this.position.y);
    this.initialAngle = this.angle;
  }

  get isStatic() { return this.type === STATIC; }

  updateTransform() {
    const c = Math.cos(this.angle), s = Math.sin(this.angle);
    this.cos = c; this.sin = s;
    const px = this.position.x, py = this.position.y;
    if (this.shape.type === 'poly') {
      const lv = this.shape.verts, ln = this.shape.normals;
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (let i = 0; i < lv.length; i++) {
        const x = px + c * lv[i].x - s * lv[i].y;
        const y = py + s * lv[i].x + c * lv[i].y;
        this.worldVerts[i].x = x; this.worldVerts[i].y = y;
        this.worldNormals[i].x = c * ln[i].x - s * ln[i].y;
        this.worldNormals[i].y = s * ln[i].x + c * ln[i].y;
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
      this.aabb.minX = minX; this.aabb.minY = minY;
      this.aabb.maxX = maxX; this.aabb.maxY = maxY;
    } else {
      const r = this.shape.radius;
      this.aabb.minX = px - r; this.aabb.maxX = px + r;
      this.aabb.minY = py - r; this.aabb.maxY = py + r;
    }
  }

  /** Velocity of the world-space point at offset r from the centre of mass. */
  pointVelocity(rx, ry) {
    return v2(this.linearVelocity.x - this.angularVelocity * ry,
              this.linearVelocity.y + this.angularVelocity * rx);
  }

  applyImpulse(px, py, rx, ry) {
    if (this.type === STATIC) return;
    this.linearVelocity.x += this.invMass * px;
    this.linearVelocity.y += this.invMass * py;
    this.angularVelocity += this.invInertia * (rx * py - ry * px);
  }

  applyForce(fx, fy) { this.force.x += fx; this.force.y += fy; }

  kineticEnergy() {
    if (this.type === STATIC) return 0;
    const v = this.linearVelocity;
    return 0.5 * this.mass * (v.x * v.x + v.y * v.y) + 0.5 * this.inertia * this.angularVelocity * this.angularVelocity;
  }

  worldPoint(local) { return toWorld(this, local); }

  wake() { this.sleeping = false; this.sleepTime = 0; }
}

/** Convenience factories used by the shared scenes. */
function makeBox(x, y, hw, hh, opts = {}) {
  return new Body(Object.assign({ shape: boxShape(hw, hh), x, y }, opts));
}
function makeCircle(x, y, r, opts = {}) {
  return new Body(Object.assign({ shape: circleShape(r), x, y }, opts));
}
function makeStaticBox(x, y, hw, hh, opts = {}) {
  return new Body(Object.assign({ shape: boxShape(hw, hh), x, y, type: STATIC }, opts));
}

// ===== src/core/collide.js =====
// Narrowphase: SAT + Sutherland-Hodgman face clipping producing 2-point
// manifolds for convex polygons, plus circle cases.
//
// Shared verbatim by both engines. Contact points carry a stable feature `id`
// so the sequential-impulse engine can warm-start from the previous frame, and
// so both engines can colour-code persistent vs new contacts in the debug view.
//
// Convention: manifold.normal points from A towards B, and `separation` is
// negative when the shapes overlap.

const LINEAR_SLOP = 0.005;          // allowed overlap, ~5 mm
const SPECULATIVE_DISTANCE = 4 * LINEAR_SLOP;

function createManifold() {
  return {
    bodyA: null,
    bodyB: null,
    normal: { x: 0, y: 0 },
    // Which body owns the reference face. The XPBD engine attaches the contact
    // frame to that body so the normal rotates with the surface that defined it.
    refIsB: false,
    count: 0,
    points: [newPoint(), newPoint()],
  };
}

function newPoint() {
  return {
    x: 0, y: 0,              // world contact position
    // Anchors relative to each centre of mass, refreshed every step.
    rax: 0, ray: 0, rbx: 0, rby: 0,
    separation: 0,
    id: 0,
    // Sequential-impulse solver scratch. XPBD keeps its own per-substep
    // contact records, so nothing here is shared between the two engines.
    normalImpulse: 0,
    tangentImpulse: 0,
    normalMass: 0,
    tangentMass: 0,
    velocityBias: 0,
    relativeVelocity: 0,
    warmStarted: false,
  };
}

function makeId(refFace, incFace, clipIndex, flip) {
  return ((refFace & 0xff) << 24) | ((incFace & 0xff) << 16) | ((clipIndex & 0xff) << 8) | (flip ? 1 : 0);
}

/**
 * Largest separation of polygon B from any face of polygon A.
 * Returns {index, separation} using cached world-space geometry.
 */
function findMaxSeparation(A, B) {
  const nA = A.worldNormals, vA = A.worldVerts;
  const vB = B.worldVerts;
  let bestIndex = 0, bestSep = -Infinity;
  for (let i = 0; i < nA.length; i++) {
    const nx = nA[i].x, ny = nA[i].y;
    const vx = vA[i].x, vy = vA[i].y;
    // Support point of B in direction -n.
    let minDot = Infinity;
    for (let j = 0; j < vB.length; j++) {
      const d = nx * (vB[j].x - vx) + ny * (vB[j].y - vy);
      if (d < minDot) minDot = d;
    }
    if (minDot > bestSep) { bestSep = minDot; bestIndex = i; }
  }
  return { index: bestIndex, separation: bestSep };
}

/** Index of the face of `inc` most anti-parallel to the reference normal. */
function findIncidentFace(inc, nx, ny) {
  const n = inc.worldNormals;
  let best = 0, minDot = Infinity;
  for (let i = 0; i < n.length; i++) {
    const d = nx * n[i].x + ny * n[i].y;
    if (d < minDot) { minDot = d; best = i; }
  }
  return best;
}

const clipA = { x: 0, y: 0, id: 0 };
const clipB = { x: 0, y: 0, id: 0 };
const outA = { x: 0, y: 0, id: 0 };
const outB = { x: 0, y: 0, id: 0 };

/** Clip segment (p0,p1) against the half-space dot(n, p) <= offset. */
function clipSegment(p0, p1, nx, ny, offset, o0, o1) {
  const d0 = nx * p0.x + ny * p0.y - offset;
  const d1 = nx * p1.x + ny * p1.y - offset;
  let count = 0;
  if (d0 <= 0) { o0.x = p0.x; o0.y = p0.y; o0.id = p0.id; count = 1; }
  if (d1 <= 0) {
    const t = count === 0 ? o0 : o1;
    t.x = p1.x; t.y = p1.y; t.id = p1.id; count++;
  }
  if ((d0 > 0) !== (d1 > 0) && count < 2) {
    const t = d0 / (d0 - d1);
    const dst = count === 0 ? o0 : o1;
    dst.x = p0.x + t * (p1.x - p0.x);
    dst.y = p0.y + t * (p1.y - p0.y);
    // The interpolated point inherits the identity of the clipped-away vertex,
    // which is what keeps the id stable while a face slides across an edge.
    dst.id = d0 > 0 ? p0.id : p1.id;
    count++;
  }
  return count;
}

function collidePolygons(A, B, m, maxDist) {
  const sepA = findMaxSeparation(A, B);
  if (sepA.separation > maxDist) return 0;
  const sepB = findMaxSeparation(B, A);
  if (sepB.separation > maxDist) return 0;

  let ref, inc, refIndex, flip;
  // Bias towards keeping A as the reference face to reduce frame-to-frame
  // flip-flopping between two nearly equal axes (which would destroy warm starts).
  if (sepB.separation > sepA.separation + 0.1 * LINEAR_SLOP) {
    ref = B; inc = A; refIndex = sepB.index; flip = true;
  } else {
    ref = A; inc = B; refIndex = sepA.index; flip = false;
  }

  const rn = ref.worldNormals[refIndex];
  const nx = rn.x, ny = rn.y;
  const rv = ref.worldVerts;
  const i1 = refIndex, i2 = (refIndex + 1) % rv.length;
  const r1 = rv[i1], r2 = rv[i2];
  // Reference face tangent, pointing from r1 to r2. Face normals are built as
  // n = perp(edge) = (ey, -ex)/|e|, so the edge direction is (-ny, nx). Getting
  // this sign wrong swaps the two clip planes and every manifold comes back empty.
  const tx = -ny, ty = nx;

  const incIndex = findIncidentFace(inc, nx, ny);
  const iv = inc.worldVerts;
  const j1 = incIndex, j2 = (incIndex + 1) % iv.length;
  clipA.x = iv[j1].x; clipA.y = iv[j1].y; clipA.id = 0;
  clipB.x = iv[j2].x; clipB.y = iv[j2].y; clipB.id = 1;

  // Clip against the two side planes of the reference face.
  const lower = tx * r1.x + ty * r1.y;
  const upper = tx * r2.x + ty * r2.y;
  let n1 = clipSegment(clipA, clipB, -tx, -ty, -lower, outA, outB);
  if (n1 < 2) return 0;
  clipA.x = outA.x; clipA.y = outA.y; clipA.id = outA.id;
  clipB.x = outB.x; clipB.y = outB.y; clipB.id = outB.id;
  n1 = clipSegment(clipA, clipB, tx, ty, upper, outA, outB);
  if (n1 < 2) return 0;

  const refOffset = nx * r1.x + ny * r1.y;
  let count = 0;
  const src = [outA, outB];
  for (let k = 0; k < 2; k++) {
    const s = nx * src[k].x + ny * src[k].y - refOffset;
    if (s <= maxDist) {
      const p = m.points[count];
      // Report the point midway between the two surfaces. Using the same world
      // point for both bodies keeps the impulse arms consistent.
      p.x = src[k].x - 0.5 * s * nx;
      p.y = src[k].y - 0.5 * s * ny;
      p.separation = s;
      p.id = makeId(refIndex, incIndex, src[k].id, flip);
      count++;
    }
  }
  if (count === 0) return 0;

  if (flip) { m.normal.x = -nx; m.normal.y = -ny; }
  else { m.normal.x = nx; m.normal.y = ny; }
  m.refIsB = flip;
  return count;
}

function collideCircles(A, B, m, maxDist) {
  const dx = B.position.x - A.position.x;
  const dy = B.position.y - A.position.y;
  const rSum = A.shape.radius + B.shape.radius;
  const d = Math.hypot(dx, dy);
  const sep = d - rSum;
  if (sep > maxDist) return 0;
  m.refIsB = false;
  let nx, ny;
  if (d > 1e-9) { nx = dx / d; ny = dy / d; } else { nx = 0; ny = 1; }
  m.normal.x = nx; m.normal.y = ny;
  const p = m.points[0];
  const ax = A.position.x + nx * A.shape.radius;
  const bx = B.position.x - nx * B.shape.radius;
  const ay = A.position.y + ny * A.shape.radius;
  const by = B.position.y - ny * B.shape.radius;
  p.x = 0.5 * (ax + bx); p.y = 0.5 * (ay + by);
  p.separation = sep;
  p.id = 0;
  return 1;
}

/** Polygon A vs circle B. Normal points from the polygon towards the circle. */
function collidePolygonCircle(A, B, m, maxDist) {
  const c = B.position, r = B.shape.radius;
  const vA = A.worldVerts, nA = A.worldNormals;
  const n = vA.length;

  let bestIndex = 0, bestSep = -Infinity;
  for (let i = 0; i < n; i++) {
    const s = nA[i].x * (c.x - vA[i].x) + nA[i].y * (c.y - vA[i].y);
    if (s > bestSep) { bestSep = s; bestIndex = i; }
  }
  if (bestSep > r + maxDist) return 0;
  m.refIsB = false;

  const i1 = bestIndex, i2 = (bestIndex + 1) % n;
  const v1 = vA[i1], v2 = vA[i2];
  let nx, ny, sep;

  if (bestSep < 1e-9) {
    // Centre is inside the polygon: use the least-penetrating face.
    nx = nA[bestIndex].x; ny = nA[bestIndex].y;
    sep = bestSep - r;
  } else {
    // Voronoi region test against the best face's endpoints.
    const ex = v2.x - v1.x, ey = v2.y - v1.y;
    const u = ((c.x - v1.x) * ex + (c.y - v1.y) * ey) / (ex * ex + ey * ey);
    let px, py;
    if (u <= 0) { px = v1.x; py = v1.y; }
    else if (u >= 1) { px = v2.x; py = v2.y; }
    else { px = v1.x + u * ex; py = v1.y + u * ey; }
    const dx = c.x - px, dy = c.y - py;
    const d = Math.hypot(dx, dy);
    if (d > 1e-9) { nx = dx / d; ny = dy / d; } else { nx = nA[bestIndex].x; ny = nA[bestIndex].y; }
    sep = d - r;
    if (sep > maxDist) return 0;
  }

  m.normal.x = nx; m.normal.y = ny;
  const p = m.points[0];
  p.x = c.x - nx * (r + 0.5 * sep);
  p.y = c.y - ny * (r + 0.5 * sep);
  p.separation = sep;
  p.id = bestIndex;
  return 1;
}

/**
 * Fill `m` with the contact manifold between A and B.
 * Returns the number of contact points (0, 1 or 2). `m.bodyA`/`m.bodyB` are set
 * so the normal always points from bodyA to bodyB.
 *
 * `maxDist` is how far apart the surfaces may be and still report a contact.
 * The sequential-impulse engine widens it by the pair's closing distance over
 * the step, which combined with the speculative velocity bias stops moderately
 * fast bodies at the surface instead of letting them pass through it.
 */
function collide(A, B, m, maxDist = SPECULATIVE_DISTANCE) {
  const ta = A.shape.type, tb = B.shape.type;
  let count;
  if (ta === 'poly' && tb === 'poly') {
    m.bodyA = A; m.bodyB = B;
    count = collidePolygons(A, B, m, maxDist);
  } else if (ta === 'circle' && tb === 'circle') {
    m.bodyA = A; m.bodyB = B;
    count = collideCircles(A, B, m, maxDist);
  } else if (ta === 'poly') {
    m.bodyA = A; m.bodyB = B;
    count = collidePolygonCircle(A, B, m, maxDist);
  } else {
    // Circle vs polygon: swap so the polygon is the reference, then flip.
    m.bodyA = B; m.bodyB = A;
    count = collidePolygonCircle(B, A, m, maxDist);
  }
  m.count = count;
  return count;
}

/** Refresh the contact anchors from the current body poses. */
function updateAnchors(m) {
  const A = m.bodyA, B = m.bodyB;
  for (let i = 0; i < m.count; i++) {
    const p = m.points[i];
    p.rax = p.x - A.position.x; p.ray = p.y - A.position.y;
    p.rbx = p.x - B.position.x; p.rby = p.y - B.position.y;
  }
}

// ===== src/core/broadphase.js =====
// Sweep-and-prune broadphase on the x axis.
//
// Bodies are kept in a persistently sorted array and re-sorted with insertion
// sort each frame, which is close to O(n) given frame-to-frame coherence. Pairs
// are reported with the lower body id first so the pair key is stable, which
// matters for warm starting.

class Broadphase {
  constructor() {
    this.sorted = [];
    this.pairs = [];
    this.pairCount = 0;
    this.margin = 0;   // constant AABB inflation
    // When set, each body's AABB is additionally inflated by dt*|v| so that a
    // fast body's pair is reported before it has already passed through.
    this.motionDt = 0;
  }

  /**
   * Drop the persistent ordering. MUST be called whenever the world's body set
   * changes: the sorted array holds body references, and a length check alone
   * is not enough — replacing a scene with another of the same size would
   * otherwise leave the broadphase simulating the previous scene's bodies while
   * the renderer drew the new ones.
   */
  reset() { this.sorted.length = 0; }

  /** @param {Body[]} bodies */
  update(bodies) {
    if (this.sorted.length !== bodies.length) this.sorted = bodies.slice();

    const arr = this.sorted;
    // Insertion sort by AABB min x (nearly sorted from the previous frame).
    for (let i = 1; i < arr.length; i++) {
      const b = arr[i];
      const key = b.aabb.minX;
      let j = i - 1;
      while (j >= 0 && arr[j].aabb.minX > key) { arr[j + 1] = arr[j]; j--; }
      arr[j + 1] = b;
    }

    const base = this.margin, mdt = this.motionDt;
    // Sorting uses the un-inflated min x, so the sweep must terminate on the
    // widest possible inflation rather than each body's own.
    let maxMotion = 0;
    if (mdt > 0) {
      for (const b of arr) {
        const v = mdt * Math.hypot(b.linearVelocity.x, b.linearVelocity.y);
        if (v > maxMotion) maxMotion = v;
      }
    }
    this.pairCount = 0;
    const pairs = this.pairs;
    for (let i = 0; i < arr.length; i++) {
      const a = arr[i];
      const m = base + (mdt > 0 ? mdt * Math.hypot(a.linearVelocity.x, a.linearVelocity.y) : 0);
      const aMaxX = a.aabb.maxX + m;
      const aMinY = a.aabb.minY - m, aMaxY = a.aabb.maxY + m;
      const aStatic = a.isStatic;
      for (let j = i + 1; j < arr.length; j++) {
        const b = arr[j];
        if (b.aabb.minX - base - maxMotion > aMaxX) break;   // sweep can stop here
        if (aStatic && b.isStatic) continue;
        if (a.sleeping && b.sleeping) continue;
        if (a.sleeping && b.isStatic) continue;
        if (b.sleeping && aStatic) continue;
        const mb = base + (mdt > 0 ? mdt * Math.hypot(b.linearVelocity.x, b.linearVelocity.y) : 0);
        if (b.aabb.maxX + mb < a.aabb.minX - m) continue;
        if (b.aabb.maxY + mb < aMinY || b.aabb.minY - mb > aMaxY) continue;
        const p = pairs[this.pairCount] || (pairs[this.pairCount] = { a: null, b: null, key: 0 });
        if (a.id < b.id) { p.a = a; p.b = b; } else { p.a = b; p.b = a; }
        // Pair key: ids are < 2^20 in every scene we build, so this is exact.
        p.key = p.a.id * 1048576 + p.b.id;
        this.pairCount++;
      }
    }
    return this.pairCount;
  }
}

// ===== src/core/sleep.js =====
// Island detection and sleeping. Shared by both engines so that the sleep
// behaviour never becomes a confounding variable in the comparison.
//
// Bodies are grouped into islands by union-find over the active contact graph.
// An island sleeps only when *every* dynamic body in it has been below the
// velocity thresholds for `sleepTime` seconds; otherwise one twitching card at
// the top of a tower would leave the rest of the structure frozen underneath it.

const SLEEP_LINEAR = 0.04;    // m/s
const SLEEP_ANGULAR = 0.12;   // rad/s
const SLEEP_TIME = 0.5;       // s below threshold before sleeping

class SleepManager {
  constructor() {
    this.parent = new Map();
    this.canSleep = new Map();
  }

  find(x) {
    const p = this.parent;
    let r = x;
    while (p.get(r) !== r) r = p.get(r);
    while (p.get(x) !== r) { const n = p.get(x); p.set(x, r); x = n; }
    return r;
  }

  union(a, b) {
    const ra = this.find(a), rb = this.find(b);
    if (ra !== rb) this.parent.set(ra, rb);
  }

  /**
   * @param bodies    all bodies in the world
   * @param contacts  iterable of {bodyA, bodyB} that are actually touching
   * @param dt        step time
   * @returns number of sleeping dynamic bodies
   */
  update(bodies, contacts, dt) {
    this.parent.clear();
    this.canSleep.clear();
    for (const b of bodies) if (!b.isStatic) this.parent.set(b.id, b.id);

    for (const c of contacts) {
      const a = c.bodyA, b = c.bodyB;
      if (a.isStatic || b.isStatic) continue;
      this.union(a.id, b.id);
    }

    // Per-body sleep timer.
    for (const b of bodies) {
      if (b.isStatic) continue;
      const v = b.linearVelocity;
      const quiet = (v.x * v.x + v.y * v.y) < SLEEP_LINEAR * SLEEP_LINEAR &&
                    Math.abs(b.angularVelocity) < SLEEP_ANGULAR;
      b.sleepTime = quiet ? b.sleepTime + dt : 0;
    }

    // An island can sleep only if every member can.
    for (const b of bodies) {
      if (b.isStatic) continue;
      const root = this.find(b.id);
      const ok = b.sleepTime >= SLEEP_TIME;
      if (!this.canSleep.has(root)) this.canSleep.set(root, ok);
      else if (!ok) this.canSleep.set(root, false);
    }

    let sleeping = 0;
    for (const b of bodies) {
      if (b.isStatic) continue;
      const ok = this.canSleep.get(this.find(b.id));
      if (ok) {
        b.sleeping = true;
        b.linearVelocity.x = 0; b.linearVelocity.y = 0; b.angularVelocity = 0;
        sleeping++;
      } else {
        b.sleeping = false;
      }
    }
    return sleeping;
  }

  /** Wake everything (used when the user drags, spawns or perturbs). */
  static wakeAll(bodies) { for (const b of bodies) { b.sleeping = false; b.sleepTime = 0; } }
}

/**
 * Safety clamp on per-step motion. Without it a single bad contact can throw a
 * body across the world and the broadphase misses everything on the way.
 */
const MAX_TRANSLATION = 2.0;    // metres per step
const MAX_ROTATION = 0.5 * Math.PI; // radians per step

function clampMotion(b, dt) {
  const v = b.linearVelocity;
  const t = dt * Math.hypot(v.x, v.y);
  if (t > MAX_TRANSLATION) {
    const s = MAX_TRANSLATION / t;
    v.x *= s; v.y *= s;
  }
  const r = dt * Math.abs(b.angularVelocity);
  if (r > MAX_ROTATION) b.angularVelocity *= MAX_ROTATION / r;
}

// ===== src/engines/si.js =====
// ---------------------------------------------------------------------------
// Approach 1: Sequential Impulses (projected Gauss-Seidel on the velocity LCP)
// ---------------------------------------------------------------------------
//
// The Box2D / Erin Catto formulation:
//
//   1. integrate velocities (gravity, external forces)
//   2. prepare contact constraints, warm start from last frame's impulses
//   3. N velocity iterations: for every contact point apply a corrective impulse
//      with *accumulated* impulse clamping (that clamp is what makes this a
//      projected Gauss-Seidel on the LCP rather than a naive impulse loop)
//   4. a separate restitution pass so bounce is not eaten by the friction loop
//   5. integrate positions
//   6. M position iterations of non-linear Gauss-Seidel: recompute geometry,
//      push overlapping pairs apart, no velocity change
//
// The two details that decide whether a card tower stands up:
//   * warm starting  — the stack's support impulses survive between frames, so
//     the solver starts from the answer instead of rediscovering it in 8 sweeps
//   * the block solver — a 2-point manifold is solved as a coupled 2x2 LCP, so a
//     box resting on a box does not rock between its two corners
//
// This file is the ONLY thing that differs from the XPBD build (plus xpbd.js).



const BAUMGARTE = 0.2;             // position correction fraction per iteration
const MAX_LINEAR_CORRECTION = 0.2; // m, stops a deep overlap from exploding
const RESTITUTION_THRESHOLD = 1.0; // m/s, below this collisions are inelastic

class Contact {
  constructor() {
    this.manifold = createManifold();
    this.key = 0;
    this.friction = 0;
    this.restitution = 0;
    this.touching = false;
    this.stamp = 0;
    // Block solver state for 2-point manifolds.
    this.k11 = 0; this.k12 = 0; this.k22 = 0;
    this.nm11 = 0; this.nm12 = 0; this.nm22 = 0;
    this.blockOk = false;
  }
  get bodyA() { return this.manifold.bodyA; }
  get bodyB() { return this.manifold.bodyB; }
}

class World {
  constructor(opts = {}) {
    this.name = 'Sequential Impulses';
    this.bodies = [];
    this.gravity = { x: 0, y: opts.gravity != null ? opts.gravity : -9.81 };

    // 16 rather than Box2D's traditional 8: the house-of-cards scene needs it
    // (measured in sweep.js — at 8 the structure creeps and falls at ~4 s).
    this.velocityIterations = opts.velocityIterations != null ? opts.velocityIterations : 16;
    this.positionIterations = opts.positionIterations != null ? opts.positionIterations : 3;
    this.warmStarting = opts.warmStarting !== false;
    this.blockSolver = opts.blockSolver !== false;
    this.allowSleep = !!opts.allowSleep;

    this.broadphase = new Broadphase();
    // Inflate AABBs so speculative contacts (which act at a positive gap) are
    // actually reported by the broadphase.
    this.broadphase.margin = SPECULATIVE_DISTANCE;
    // Extend contact detection by how far a pair can close during one step, so
    // that fast bodies are caught before they are already through. Combined
    // with the speculative velocity bias this stops them exactly at the surface.
    // This is not full CCD — see README for the measured threshold.
    this.continuous = opts.continuous !== false;
    this.contacts = new Map();     // pair key -> Contact
    this.contactList = [];
    this.sleepManager = new SleepManager();
    this.scratch = createManifold();
    this.stamp = 0;
    this.time = 0;

    this.stats = {
      bodies: 0, contacts: 0, points: 0, sleeping: 0,
      maxPenetration: 0, avgPenetration: 0, energy: 0,
      broadMs: 0, narrowMs: 0, solveMs: 0, positionMs: 0, totalMs: 0,
      velocityIterations: this.velocityIterations,
      positionIterations: this.positionIterations,
      blockFallbacks: 0,
    };
  }

  /** Knobs the UI is allowed to expose, with ranges. Shared shape with XPBD. */
  static get params() {
    return [
      { key: 'velocityIterations', label: 'Velocity iterations', min: 1, max: 40, step: 1 },
      { key: 'positionIterations', label: 'Position iterations', min: 0, max: 20, step: 1 },
      { key: 'warmStarting', label: 'Warm starting', type: 'bool' },
      { key: 'blockSolver', label: 'Block solver (2-pt LCP)', type: 'bool' },
      { key: 'continuous', label: 'Speculative CCD', type: 'bool' },
    ];
  }

  addBody(b) { this.bodies.push(b); this.broadphase.reset(); return b; }

  removeBody(b) {
    const i = this.bodies.indexOf(b);
    if (i >= 0) this.bodies.splice(i, 1);
    this.broadphase.reset();
    for (const [k, c] of this.contacts) if (c.bodyA === b || c.bodyB === b) this.contacts.delete(k);
  }

  clear() { this.bodies.length = 0; this.contacts.clear(); this.contactList.length = 0; this.broadphase.reset(); this.time = 0; }

  wakeAll() { SleepManager.wakeAll(this.bodies); }

  step(dt) {
    if (dt <= 0) return;
    const t0 = now();
    this.stamp++;
    this.time += dt;
    const invDt = 1 / dt;

    for (const b of this.bodies) b.updateTransform();

    const t1 = now();
    this.broadphase.motionDt = this.continuous ? dt : 0;
    const nPairs = this.broadphase.update(this.bodies);
    const t2 = now();
    this.collectContacts(nPairs, dt);
    const t3 = now();

    this.integrateVelocities(dt);
    this.prepareContacts(invDt);
    if (this.warmStarting) this.warmStart();

    for (let i = 0; i < this.velocityIterations; i++) this.solveVelocities();
    this.applyRestitution();

    const t4 = now();
    this.integratePositions(dt);
    const minSep = this.solvePositions();
    const t5 = now();

    for (const b of this.bodies) b.updateTransform();

    if (this.allowSleep) {
      this.stats.sleeping = this.sleepManager.update(this.bodies, this.contactList, dt);
    } else {
      this.stats.sleeping = 0;
      for (const b of this.bodies) b.sleeping = false;
    }

    this.collectStats(minSep, t0, t1, t2, t3, t4, t5);
  }

  // -- pipeline stages -------------------------------------------------------

  collectContacts(nPairs, dt) {
    const pairs = this.broadphase.pairs;
    const list = this.contactList;
    list.length = 0;
    for (let i = 0; i < nPairs; i++) {
      const p = pairs[i];
      let c = this.contacts.get(p.key);
      if (!c) { c = new Contact(); c.key = p.key; this.contacts.set(p.key, c); }

      // Cache the previous manifold's impulses keyed by feature id.
      const m = c.manifold;
      const oldCount = c.touching ? m.count : 0;
      let o0n = 0, o0t = 0, o0id = -1, o1n = 0, o1t = 0, o1id = -1;
      if (oldCount > 0) { o0n = m.points[0].normalImpulse; o0t = m.points[0].tangentImpulse; o0id = m.points[0].id; }
      if (oldCount > 1) { o1n = m.points[1].normalImpulse; o1t = m.points[1].tangentImpulse; o1id = m.points[1].id; }

      // Widen the acceptance distance by how far this pair can close in one
      // step. The resulting contact is speculative: the solver clamps the
      // approach to exactly the gap, so the body lands on the surface.
      let maxDist = SPECULATIVE_DISTANCE;
      if (this.continuous) {
        const va = p.a.linearVelocity, vb = p.b.linearVelocity;
        maxDist += dt * (Math.hypot(va.x, va.y) + Math.hypot(vb.x, vb.y));
      }
      const count = collide(p.a, p.b, m, maxDist);
      c.touching = count > 0;
      c.stamp = this.stamp;
      if (!count) continue;

      for (let k = 0; k < count; k++) {
        const pt = m.points[k];
        pt.warmStarted = false;
        pt.normalImpulse = 0; pt.tangentImpulse = 0;
        if (pt.id === o0id) { pt.normalImpulse = o0n; pt.tangentImpulse = o0t; pt.warmStarted = true; }
        else if (pt.id === o1id) { pt.normalImpulse = o1n; pt.tangentImpulse = o1t; pt.warmStarted = true; }
      }

      const A = m.bodyA, B = m.bodyB;
      c.friction = Math.sqrt(A.friction * B.friction);
      c.restitution = Math.max(A.restitution, B.restitution);
      list.push(c);
      if (A.sleeping && (!B.sleeping && !B.isStatic)) A.wake();
      if (B.sleeping && (!A.sleeping && !A.isStatic)) B.wake();
    }

    // Drop pair caches that no longer overlap so the map does not grow forever.
    if ((this.stamp & 31) === 0) {
      for (const [k, c] of this.contacts) if (c.stamp !== this.stamp) this.contacts.delete(k);
    }
  }

  integrateVelocities(dt) {
    const g = this.gravity;
    for (const b of this.bodies) {
      if (b.isStatic || b.sleeping) continue;
      b.linearVelocity.x += dt * (g.x + b.invMass * b.force.x);
      b.linearVelocity.y += dt * (g.y + b.invMass * b.force.y);
      b.angularVelocity += dt * b.invInertia * b.torque;
      b.force.x = 0; b.force.y = 0; b.torque = 0;
      clampMotion(b, dt);
    }
  }

  prepareContacts(invDt) {
    for (const c of this.contactList) {
      const m = c.manifold;
      const A = m.bodyA, B = m.bodyB;
      const nx = m.normal.x, ny = m.normal.y;
      const tx = ny, ty = -nx;   // tangent = perp(normal)
      const imA = A.invMass, imB = B.invMass, iiA = A.invInertia, iiB = B.invInertia;
      updateAnchors(m);

      for (let i = 0; i < m.count; i++) {
        const p = m.points[i];
        const rnA = p.rax * ny - p.ray * nx;
        const rnB = p.rbx * ny - p.rby * nx;
        const kn = imA + imB + iiA * rnA * rnA + iiB * rnB * rnB;
        p.normalMass = kn > 0 ? 1 / kn : 0;

        const rtA = p.rax * ty - p.ray * tx;
        const rtB = p.rbx * ty - p.rby * tx;
        const kt = imA + imB + iiA * rtA * rtA + iiB * rtB * rtB;
        p.tangentMass = kt > 0 ? 1 / kt : 0;

        // Speculative contact: if the shapes are still apart, allow them to
        // approach exactly fast enough to touch and no faster. The constraint
        // is vn >= -separation/dt, so the bias enters the solve as (vn + bias).
        // Getting this sign wrong turns every near-contact into a repulsor.
        p.velocityBias = p.separation > 0 ? p.separation * invDt : 0;

        // Approach speed captured before the solve, used by the restitution pass.
        const dvx = (B.linearVelocity.x - B.angularVelocity * p.rby) - (A.linearVelocity.x - A.angularVelocity * p.ray);
        const dvy = (B.linearVelocity.y + B.angularVelocity * p.rbx) - (A.linearVelocity.y + A.angularVelocity * p.rax);
        p.relativeVelocity = dvx * nx + dvy * ny;
      }

      // Pre-factor the 2x2 block system for two-point manifolds.
      c.blockOk = false;
      if (this.blockSolver && m.count === 2) {
        const p1 = m.points[0], p2 = m.points[1];
        const rn1A = p1.rax * ny - p1.ray * nx, rn1B = p1.rbx * ny - p1.rby * nx;
        const rn2A = p2.rax * ny - p2.ray * nx, rn2B = p2.rbx * ny - p2.rby * nx;
        const k11 = imA + imB + iiA * rn1A * rn1A + iiB * rn1B * rn1B;
        const k22 = imA + imB + iiA * rn2A * rn2A + iiB * rn2B * rn2B;
        const k12 = imA + imB + iiA * rn1A * rn2A + iiB * rn1B * rn2B;
        // Reject ill-conditioned systems (near-collinear rows); fall back to
        // point-by-point Gauss-Seidel in that case.
        const det = k11 * k22 - k12 * k12;
        if (k11 * k11 < 1000 * det) {
          const invDet = 1 / det;
          c.k11 = k11; c.k12 = k12; c.k22 = k22;
          c.nm11 = k22 * invDet; c.nm12 = -k12 * invDet; c.nm22 = k11 * invDet;
          c.blockOk = true;
        }
      }
    }
  }

  warmStart() {
    for (const c of this.contactList) {
      const m = c.manifold;
      const A = m.bodyA, B = m.bodyB;
      const nx = m.normal.x, ny = m.normal.y;
      const tx = ny, ty = -nx;
      for (let i = 0; i < m.count; i++) {
        const p = m.points[i];
        if (!p.warmStarted) continue;
        const px = p.normalImpulse * nx + p.tangentImpulse * tx;
        const py = p.normalImpulse * ny + p.tangentImpulse * ty;
        applyPair(A, B, px, py, p);
      }
    }
  }

  solveVelocities() {
    for (const c of this.contactList) {
      const m = c.manifold;
      const A = m.bodyA, B = m.bodyB;
      const nx = m.normal.x, ny = m.normal.y;
      const tx = ny, ty = -nx;

      // --- friction first, using the normal impulse from the previous pass ---
      for (let i = 0; i < m.count; i++) {
        const p = m.points[i];
        const dvx = (B.linearVelocity.x - B.angularVelocity * p.rby) - (A.linearVelocity.x - A.angularVelocity * p.ray);
        const dvy = (B.linearVelocity.y + B.angularVelocity * p.rbx) - (A.linearVelocity.y + A.angularVelocity * p.rax);
        const vt = dvx * tx + dvy * ty;
        let lambda = -p.tangentMass * vt;
        const maxF = c.friction * p.normalImpulse;
        const old = p.tangentImpulse;
        p.tangentImpulse = Math.max(-maxF, Math.min(old + lambda, maxF));
        lambda = p.tangentImpulse - old;
        applyPair(A, B, lambda * tx, lambda * ty, p);
      }

      // --- normal constraints ---
      if (c.blockOk && m.count === 2) {
        this.solveBlock(c, A, B, nx, ny);
      } else {
        for (let i = 0; i < m.count; i++) {
          const p = m.points[i];
          const dvx = (B.linearVelocity.x - B.angularVelocity * p.rby) - (A.linearVelocity.x - A.angularVelocity * p.ray);
          const dvy = (B.linearVelocity.y + B.angularVelocity * p.rbx) - (A.linearVelocity.y + A.angularVelocity * p.rax);
          const vn = dvx * nx + dvy * ny;
          let lambda = -p.normalMass * (vn + p.velocityBias);
          const old = p.normalImpulse;
          p.normalImpulse = Math.max(old + lambda, 0);   // accumulated clamp
          lambda = p.normalImpulse - old;
          applyPair(A, B, lambda * nx, lambda * ny, p);
        }
      }
    }
  }

  /**
   * Solve both normal constraints of a 2-point manifold simultaneously.
   *
   * A box resting on a box has two contact points whose constraints are
   * strongly coupled: pushing at one corner rotates the body into the other.
   * Point-by-point Gauss-Seidel ping-pongs between them and the box visibly
   * rocks. Solving the 2x2 LCP directly removes that mode. Four cases:
   * both points active, only one active (twice), neither active.
   */
  solveBlock(c, A, B, nx, ny) {
    const m = c.manifold;
    const p1 = m.points[0], p2 = m.points[1];
    const a1 = p1.normalImpulse, a2 = p2.normalImpulse;

    const dv1x = (B.linearVelocity.x - B.angularVelocity * p1.rby) - (A.linearVelocity.x - A.angularVelocity * p1.ray);
    const dv1y = (B.linearVelocity.y + B.angularVelocity * p1.rbx) - (A.linearVelocity.y + A.angularVelocity * p1.rax);
    const dv2x = (B.linearVelocity.x - B.angularVelocity * p2.rby) - (A.linearVelocity.x - A.angularVelocity * p2.ray);
    const dv2y = (B.linearVelocity.y + B.angularVelocity * p2.rbx) - (A.linearVelocity.y + A.angularVelocity * p2.rax);
    let vn1 = dv1x * nx + dv1y * ny;
    let vn2 = dv2x * nx + dv2y * ny;

    // b = velocity error with the current accumulated impulses removed.
    let b1 = vn1 + p1.velocityBias - (c.k11 * a1 + c.k12 * a2);
    let b2 = vn2 + p2.velocityBias - (c.k12 * a1 + c.k22 * a2);

    let x1 = 0, x2 = 0, solved = false;

    // Case 1: both constraints active.
    x1 = -(c.nm11 * b1 + c.nm12 * b2);
    x2 = -(c.nm12 * b1 + c.nm22 * b2);
    if (x1 >= 0 && x2 >= 0) solved = true;

    // Case 2: only point 1 active.
    if (!solved) {
      x1 = -p1.normalMass * b1; x2 = 0;
      vn2 = c.k12 * x1 + b2;
      if (x1 >= 0 && vn2 >= 0) solved = true;
    }
    // Case 3: only point 2 active.
    if (!solved) {
      x1 = 0; x2 = -p2.normalMass * b2;
      vn1 = c.k12 * x2 + b1;
      if (x2 >= 0 && vn1 >= 0) solved = true;
    }
    // Case 4: neither active (both separating).
    if (!solved) {
      x1 = 0; x2 = 0;
      vn1 = b1; vn2 = b2;
      if (vn1 >= 0 && vn2 >= 0) solved = true;
    }
    if (!solved) {
      // No consistent case (can happen with numerical noise): keep the current
      // impulses and let the next iteration try again.
      this.stats.blockFallbacks++;
      return;
    }

    const d1 = x1 - a1, d2 = x2 - a2;
    applyPair(A, B, d1 * nx, d1 * ny, p1);
    applyPair(A, B, d2 * nx, d2 * ny, p2);
    p1.normalImpulse = x1;
    p2.normalImpulse = x2;
  }

  /**
   * Restitution as a separate pass after the main solve. Mixing it into the
   * velocity iterations makes stacks jitter, because every iteration re-injects
   * bounce energy that the other contacts then have to absorb.
   */
  applyRestitution() {
    for (const c of this.contactList) {
      if (c.restitution === 0) continue;
      const m = c.manifold;
      const A = m.bodyA, B = m.bodyB;
      const nx = m.normal.x, ny = m.normal.y;
      for (let i = 0; i < m.count; i++) {
        const p = m.points[i];
        if (p.relativeVelocity > -RESTITUTION_THRESHOLD || p.normalImpulse === 0) continue;
        const dvx = (B.linearVelocity.x - B.angularVelocity * p.rby) - (A.linearVelocity.x - A.angularVelocity * p.ray);
        const dvy = (B.linearVelocity.y + B.angularVelocity * p.rbx) - (A.linearVelocity.y + A.angularVelocity * p.rax);
        const vn = dvx * nx + dvy * ny;
        let lambda = -p.normalMass * (vn + c.restitution * p.relativeVelocity);
        const old = p.normalImpulse;
        p.normalImpulse = Math.max(old + lambda, 0);
        lambda = p.normalImpulse - old;
        applyPair(A, B, lambda * nx, lambda * ny, p);
      }
    }
  }

  integratePositions(dt) {
    for (const b of this.bodies) {
      if (b.isStatic || b.sleeping) continue;
      clampMotion(b, dt);
      b.position.x += dt * b.linearVelocity.x;
      b.position.y += dt * b.linearVelocity.y;
      b.angle += dt * b.angularVelocity;
    }
  }

  /**
   * Non-linear Gauss-Seidel position correction. Geometry is re-evaluated from
   * the current poses on every iteration (that is what makes it "non-linear"),
   * so deep overlaps unwind correctly instead of being linearised once.
   * Velocities are deliberately untouched: this removes drift without adding
   * the energy that a Baumgarte velocity bias would.
   */
  solvePositions() {
    let minSep = 0;
    for (let iter = 0; iter < this.positionIterations; iter++) {
      minSep = 0;
      for (const c of this.contactList) {
        const A = c.bodyA, B = c.bodyB;
        if ((A.isStatic || A.sleeping) && (B.isStatic || B.sleeping)) continue;
        A.updateTransform(); B.updateTransform();
        const m = this.scratch;
        if (!collide(A, B, m)) continue;
        const nx = m.normal.x, ny = m.normal.y;
        const imA = A.invMass, imB = B.invMass, iiA = A.invInertia, iiB = B.invInertia;
        for (let i = 0; i < m.count; i++) {
          const p = m.points[i];
          if (p.separation < minSep) minSep = p.separation;
          const rax = p.x - A.position.x, ray = p.y - A.position.y;
          const rbx = p.x - B.position.x, rby = p.y - B.position.y;
          const rnA = rax * ny - ray * nx;
          const rnB = rbx * ny - rby * nx;
          const k = imA + imB + iiA * rnA * rnA + iiB * rnB * rnB;
          if (k <= 0) continue;
          // Leave LINEAR_SLOP of overlap alone: contacts that are exactly
          // touching would otherwise be pushed apart and re-collide forever.
          const cErr = Math.max(-MAX_LINEAR_CORRECTION,
                                Math.min(BAUMGARTE * (p.separation + LINEAR_SLOP), 0));
          const impulse = -cErr / k;
          const px = impulse * nx, py = impulse * ny;
          if (!A.isStatic && !A.sleeping) {
            A.position.x -= imA * px; A.position.y -= imA * py;
            A.angle -= iiA * (rax * py - ray * px);
          }
          if (!B.isStatic && !B.sleeping) {
            B.position.x += imB * px; B.position.y += imB * py;
            B.angle += iiB * (rbx * py - rby * px);
          }
        }
      }
      // Early out once every overlap is within tolerance.
      if (minSep >= -3 * LINEAR_SLOP) break;
    }
    return minSep;
  }

  collectStats(minSep, t0, t1, t2, t3, t4, t5) {
    const s = this.stats;
    let points = 0, sumPen = 0, maxPen = 0, energy = 0;
    for (const c of this.contactList) {
      const m = c.manifold;
      for (let i = 0; i < m.count; i++) {
        const sep = m.points[i].separation;
        points++;
        if (sep < 0) { sumPen += -sep; if (-sep > maxPen) maxPen = -sep; }
      }
    }
    for (const b of this.bodies) energy += b.kineticEnergy();
    s.bodies = this.bodies.length;
    s.contacts = this.contactList.length;
    s.points = points;
    s.maxPenetration = maxPen;
    s.avgPenetration = points ? sumPen / points : 0;
    s.energy = energy;
    s.broadMs = t2 - t1;
    s.narrowMs = t3 - t2;
    s.solveMs = t4 - t3;
    s.positionMs = t5 - t4;
    s.totalMs = now() - t0;
    s.velocityIterations = this.velocityIterations;
    s.positionIterations = this.positionIterations;
  }

  /** Contact points for the debug renderer. */
  debugContacts() {
    const out = [];
    for (const c of this.contactList) {
      const m = c.manifold;
      for (let i = 0; i < m.count; i++) {
        const p = m.points[i];
        out.push({ x: p.x, y: p.y, nx: m.normal.x, ny: m.normal.y,
                   impulse: p.normalImpulse, warm: p.warmStarted, separation: p.separation });
      }
    }
    return out;
  }
}

function applyPair(A, B, px, py, p) {
  if (!A.isStatic && !A.sleeping) {
    A.linearVelocity.x -= A.invMass * px;
    A.linearVelocity.y -= A.invMass * py;
    A.angularVelocity -= A.invInertia * (p.rax * py - p.ray * px);
  }
  if (!B.isStatic && !B.sleeping) {
    B.linearVelocity.x += B.invMass * px;
    B.linearVelocity.y += B.invMass * py;
    B.angularVelocity += B.invInertia * (p.rbx * py - p.rby * px);
  }
}

const now = (typeof performance !== 'undefined' && performance.now)
  ? () => performance.now()
  : () => Number(process.hrtime.bigint() / 1000n) / 1000;

// ===== src/scenes.js =====
// Demo scenes. Identical for both engines, built from a seeded RNG so the two
// solvers see bit-for-bit identical initial conditions.
//
// Everything is in SI units: metres, kilograms, seconds. Gravity is -9.81 m/s^2.
// The ground plane is y = 0.


const GROUND_FRICTION = 0.7;

function addGround(world, halfWidth = 8) {
  const g = makeStaticBox(0, -0.5, halfWidth, 0.5, { friction: GROUND_FRICTION, color: '#3a4252', label: 'ground' });
  world.addBody(g);
  return g;
}

// ---------------------------------------------------------------------------
// House of cards
// ---------------------------------------------------------------------------
//
// Card geometry. A real playing card is about 300:1 (89 mm x 0.3 mm) which no
// rigid body engine handles; 15:1 is the honest "thin plank" compromise, and is
// already thin enough to expose solver problems (see notes.md).
const CARD_HALF_LEN = 0.30;    // 0.60 m long
const CARD_HALF_THK = 0.02;    // 0.04 m thick  -> 15:1
const CARD_LEAN = 18 * Math.PI / 180;
const CARD_FRICTION = 0.75;
// Bay spacing is pinned by the real construction: each flat card spans one bay,
// so its ends land just inboard of two adjacent apexes, and adjacent flat cards
// butt end-to-end over each apex without overlapping. That forces
// spacing == card length (plus a hair of clearance). Any other value either
// starts the scene interpenetrated or leaves the flat cards unsupported.
const PAIR_SPACING = 2 * CARD_HALF_LEN + 0.004;   // 0.604 m
const BASE_CLEAR = 0.0005;                       // clearance under each card

function addCard(world, cx, cy, angle, opts) {
  return world.addBody(makeBox(cx, cy, CARD_HALF_THK, CARD_HALF_LEN,
                               Object.assign({ angle }, opts)));
}

/**
 * One A-frame: two cards leaning together, top corners nearly touching.
 * A small gap is left at the apex so the pair *settles* into contact rather
 * than starting interpenetrated — starting a scene inside a deep overlap would
 * measure the engines' recovery from a bad state, not their stacking quality.
 */
function addCardPair(world, cx, yBase, rng, opts) {
  const L = CARD_HALF_LEN, t = CARD_HALF_THK;
  const gap = 0.004;
  // Deterministic asymmetry: perfectly symmetric structures are a degenerate
  // special case (exact ties in SAT axis selection) and are not representative.
  const thetaL = CARD_LEAN + rng.sym(0.012);
  const thetaR = CARD_LEAN + rng.sym(0.012);
  // A tilted card stands on ONE bottom corner, which is t*sin(theta) below the
  // centre of its bottom face — so the centre has to be lifted by that much or
  // the card starts buried in whatever it is standing on.
  const yL = yBase + t * Math.sin(thetaL) + L * Math.cos(thetaL) + BASE_CLEAR;
  const yR = yBase + t * Math.sin(thetaR) + L * Math.cos(thetaR) + BASE_CLEAR;
  const left = addCard(world, cx - t * Math.cos(thetaL) - gap - L * Math.sin(thetaL), yL, -thetaL, opts);
  const right = addCard(world, cx + t * Math.cos(thetaR) + gap + L * Math.sin(thetaR), yR, thetaR, opts);
  return { left, right };
}

function houseOfCards(world, tiers = 4) {
  const rng = new Rng(20260808);
  addGround(world);
  const cardOpts = { friction: CARD_FRICTION, restitution: 0, density: 1, color: '#e8dcc0' };
  const flatOpts = { friction: CARD_FRICTION, restitution: 0, density: 1, color: '#d9c9a3' };

  // Height of the A-frame's outer top corner above the tier floor: the card is
  // lifted by t*sin(theta) so it stands on its low corner, and its high top
  // corner is another t*sin(theta) above the top face centre. Getting either
  // term wrong buries a card several millimetres into its neighbour at t = 0,
  // which detonates the structure on the first step.
  const cornerRise = 2 * CARD_HALF_LEN * Math.cos(CARD_LEAN)
                   + 2 * CARD_HALF_THK * Math.sin(CARD_LEAN) + BASE_CLEAR;
  const clearance = 0.003;
  const tierPitch = cornerRise + clearance + 2 * CARD_HALF_THK;
  const baseCount = tiers;
  let yBase = 0;

  for (let tier = 0; tier < tiers; tier++) {
    const count = baseCount - tier;
    const x0 = -(count - 1) * PAIR_SPACING * 0.5;
    for (let i = 0; i < count; i++) {
      addCardPair(world, x0 + i * PAIR_SPACING, yBase, rng, cardOpts);
    }
    // One flat card per bay. Each end rests on the nearer top corner of the
    // A-frame below it, so every apex carries two card ends — one from each
    // side — and the load on each A-frame stays balanced. The next tier's
    // A-frames then sit centred on these flat cards, feet well inside the span.
    for (let i = 0; i < count - 1; i++) {
      world.addBody(makeBox(x0 + (i + 0.5) * PAIR_SPACING,
                            yBase + cornerRise + clearance + CARD_HALF_THK,
                            CARD_HALF_LEN, CARD_HALF_THK, flatOpts));
    }
    yBase += tierPitch;
  }
  // Mark the topmost cards so the metrics code can watch the apex height.
  const maxY = Math.max(...world.bodies.filter((b) => !b.isStatic).map((b) => b.position.y));
  for (const b of world.bodies) if (!b.isStatic && b.position.y > maxY - 0.4) b.tracked = true;
}

/**
 * Kick the outermost foot of the lowest-left A-frame outwards — the way a real
 * house of cards is knocked down. Strong enough to be unambiguous: a nudge that
 * a stable solver simply absorbs makes for a useless collapse test.
 */
/**
 * Pull one card out of the bottom tier — the canonical way a house of cards
 * comes down, and a decisive perturbation.
 *
 * Kicking a card instead turned out to be a poor test: the structure loads its
 * own feet heavily, so friction absorbs even a 3.5 m/s flick within ~100 mm.
 * That is correct physics rather than solver stiffness (both engines agreed),
 * but it makes for a collapse test that never collapses.
 */
function pullBottomCard(world) {
  const cards = world.bodies.filter((b) => !b.isStatic);
  const lowest = Math.min(...cards.map((b) => b.position.y));
  const bottom = cards.filter((b) => b.position.y < lowest + 0.1);
  // Second A-frame from the left: removing an interior support drops the tier
  // above it, rather than just toppling the end of the structure.
  bottom.sort((a, b) => a.position.x - b.position.x);
  const target = bottom[Math.min(2, bottom.length - 1)];
  world.removeBody(target);
  world.wakeAll();
}
