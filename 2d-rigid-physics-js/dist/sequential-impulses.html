        const mu = mus[i];
        const x0 = -3.6 + i * 2.4;
        const ramp = new Body({
          shape: boxShape(1.0, 0.05), x: x0, y: 0.9, angle: ang, type: STATIC,
          friction: mu, color: '#3a4252', label: `ramp ${mu}`,
        });
        world.addBody(ramp);
        // Block sits on the ramp surface, up-slope end.
        const bh = 0.12;
        const along = -0.5;
        const nx = -Math.sin(ang), ny = Math.cos(ang);
        const tx = Math.cos(ang), ty = Math.sin(ang);
        world.addBody(makeBox(
          x0 + tx * along + nx * (0.05 + bh + 0.002),
          0.9 + ty * along + ny * (0.05 + bh + 0.002),
          bh, bh, {
            angle: ang, friction: mu, restitution: 0, tracked: true,
            color: mu < Math.tan(ang) ? '#c9705a' : '#5a9c78',
            label: `mu=${mu.toFixed(2)}`,
          }));
      }
    },
    perturb(world) { world.wakeAll(); },
    perturbLabel: 'Wake all',
  },

  arch: {
    name: 'Corbelled arch',
    blurb: 'A dry-stone corbel arch closed by a heavy capstone. Every block cantilevers over the one below, so the whole thing is a stack of overturning moments in near balance.',
    view: { cx: 0, cy: 1.1, height: 3.0 },
    build(world) {
      addGround(world);
      const rng = new Rng(555);
      const hw = 0.22, hh = 0.09;
      const courses = 9;
      // Corbel step is bounded by the classic overhang limit: the centre of
      // mass of everything above course i must stay over course i's footprint,
      // which caps the step at about 2*hw/courses. 45 mm leaves a small margin;
      // the first version used 140 mm and simply fell over, correctly.
      for (let r = 0; r < courses; r++) {
        const inset = 0.045 * r;
        for (const side of [-1, 1]) {
          const x = side * (0.9 - inset);
          world.addBody(makeBox(x + rng.sym(0.001), hh + r * (2 * hh + 0.001), hw, hh, {
            friction: 0.8, restitution: 0, color: `hsl(${35 + r * 3} 25% ${58 - r * 2}%)`,
            tracked: r >= courses - 2,
          }));
        }
      }
      // Capstone bridging the top of the corbel; twice the density of the
      // blocks, so it genuinely loads the structure.
      world.addBody(makeBox(0, hh + courses * (2 * hh + 0.001), 0.46, hh, {
        friction: 0.8, restitution: 0, density: 2, color: '#9a8f7a', tracked: true,
      }));
    },
    perturb(world) {
      const ball = makeCircle(0, 3.4, 0.2, { density: 8, friction: 0.5, restitution: 0.0, color: '#c94f4f' });
      world.addBody(ball);
      world.wakeAll();
    },
    perturbLabel: 'Drop a weight on the capstone',
  },
};

const sceneKeys = Object.keys(scenes);

/** Build a scene into a fresh world. Body ids restart so both engines match. */
function buildScene(world, key) {
  world.clear();
  resetBodyIds();
  const s = scenes[key] || scenes.houseOfCards;
  s.build(world);
  for (const b of world.bodies) b.updateTransform();
  return s;
}

// ===== src/metrics.js =====
// Scene-level measurements shared by the browser HUD and the headless bench.
// These are the numbers the evaluation in README.md is built from.

function measure(world) {
  let apex = -Infinity;
  let maxDisp = 0, sumDisp = 0, n = 0;
  let moving = 0, energy = 0;
  let trackedApex = -Infinity;
  for (const b of world.bodies) {
    if (b.isStatic) continue;
    n++;
    const dx = b.position.x - b.initialPosition.x;
    const dy = b.position.y - b.initialPosition.y;
    const d = Math.hypot(dx, dy);
    sumDisp += d;
    if (d > maxDisp) maxDisp = d;
    if (b.position.y > apex) apex = b.position.y;
    if (b.tracked && b.position.y > trackedApex) trackedApex = b.position.y;
    const v = b.linearVelocity;
    if (v.x * v.x + v.y * v.y > 0.01 || Math.abs(b.angularVelocity) > 0.2) moving++;
    energy += b.kineticEnergy();
  }
  return {
    apexHeight: apex === -Infinity ? 0 : apex,
    trackedHeight: trackedApex === -Infinity ? 0 : trackedApex,
    maxDisplacement: maxDisp,
    avgDisplacement: n ? sumDisp / n : 0,
    movingBodies: moving,
    dynamicBodies: n,
    energy,
    maxPenetration: world.stats.maxPenetration,
    avgPenetration: world.stats.avgPenetration,
    contacts: world.stats.contacts,
    points: world.stats.points,
  };
}

/**
 * A cheap order-sensitive hash of the whole world state. Two runs that agree on
 * this are bit-identical, which is how the determinism check works.
 */
function stateHash(world) {
  let h = 2166136261 >>> 0;
  const buf = new Float64Array(1);
  const view = new Uint32Array(buf.buffer);
  const mix = (x) => {
    buf[0] = x;
    h ^= view[0]; h = Math.imul(h, 16777619) >>> 0;
    h ^= view[1]; h = Math.imul(h, 16777619) >>> 0;
  };
  for (const b of world.bodies) {
    mix(b.position.x); mix(b.position.y); mix(b.angle);
    mix(b.linearVelocity.x); mix(b.linearVelocity.y); mix(b.angularVelocity);
  }
  return h >>> 0;
}

// ===== src/app/renderer.js =====
// Canvas renderer + debug draw. Shared by both builds.

class Renderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.camera = { x: 0, y: 1.5, height: 4 };   // world units visible vertically
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.show = { contacts: false, normals: false, aabb: false, impulses: false, com: false };
  }

  resize() {
    const r = this.canvas.getBoundingClientRect();
    this.canvas.width = Math.max(1, Math.round(r.width * this.dpr));
    this.canvas.height = Math.max(1, Math.round(r.height * this.dpr));
    this.w = r.width; this.h = r.height;
  }

  get scale() { return this.h / this.camera.height; }

  toScreen(x, y) {
    const s = this.scale;
    return [(x - this.camera.x) * s + this.w / 2, this.h - (y - this.camera.y) * s - this.h / 2];
  }

  toWorld(px, py) {
    const s = this.scale;
    return {
      x: (px - this.w / 2) / s + this.camera.x,
      y: (this.h / 2 - py) / s + this.camera.y,
    };
  }

  fitTo(view) {
    this.camera.x = view.cx;
    this.camera.y = view.cy;
    this.camera.height = view.height;
  }

  draw(world) {
    const ctx = this.ctx;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, this.w, this.h);

    this.drawGrid();

    for (const b of world.bodies) this.drawBody(ctx, b);

    if (this.show.aabb) {
      ctx.strokeStyle = 'rgba(120,200,255,0.35)';
      ctx.lineWidth = 1;
      for (const b of world.bodies) {
        const [x0, y0] = this.toScreen(b.aabb.minX, b.aabb.maxY);
        const [x1, y1] = this.toScreen(b.aabb.maxX, b.aabb.minY);
        ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
      }
    }

    if (this.show.contacts || this.show.normals || this.show.impulses) {
      const cs = world.debugContacts();
      let maxJ = 1e-9;
      for (const c of cs) if (c.impulse > maxJ) maxJ = c.impulse;
      for (const c of cs) {
        const [x, y] = this.toScreen(c.x, c.y);
        if (this.show.contacts) {
          // Persistent (warm-started) contacts are drawn differently from new
          // ones: a stack that is holding shows solid dots, a stack whose
          // manifolds keep being rebuilt shows flickering rings.
          ctx.fillStyle = c.warm ? '#ffd166' : '#ff6b6b';
          ctx.beginPath();
          ctx.arc(x, y, c.warm ? 2.6 : 2.0, 0, 6.2832);
          ctx.fill();
        }
        if (this.show.normals) {
          ctx.strokeStyle = 'rgba(255,209,102,0.8)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + c.nx * 14, y - c.ny * 14);
          ctx.stroke();
        }
        if (this.show.impulses && c.impulse > 0) {
          const l = 6 + 34 * Math.sqrt(c.impulse / maxJ);
          ctx.strokeStyle = 'rgba(120,220,160,0.85)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + c.nx * l, y - c.ny * l);
          ctx.stroke();
        }
      }
    }
  }

  drawGrid() {
    const ctx = this.ctx;
    const step = 1;
    const left = this.camera.x - (this.w / this.scale) / 2;
    const right = this.camera.x + (this.w / this.scale) / 2;
    const bottom = this.camera.y - this.camera.height / 2;
    const top = this.camera.y + this.camera.height / 2;
    ctx.strokeStyle = 'rgba(255,255,255,0.045)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = Math.floor(left / step) * step; x <= right; x += step) {
      const [sx] = this.toScreen(x, 0);
      ctx.moveTo(sx, 0); ctx.lineTo(sx, this.h);
    }
    for (let y = Math.floor(bottom / step) * step; y <= top; y += step) {
      const [, sy] = this.toScreen(0, y);
      ctx.moveTo(0, sy); ctx.lineTo(this.w, sy);
    }
    ctx.stroke();
  }

  drawBody(ctx, b) {
    const fill = b.isStatic ? '#39404f' : (b.color || '#c9d2e3');
    ctx.fillStyle = b.sleeping ? mixHex(fill, '#4a5060', 0.55) : fill;
    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.lineWidth = 1;

    if (b.shape.type === 'poly') {
      const v = b.worldVerts;
      ctx.beginPath();
      let p = this.toScreen(v[0].x, v[0].y);
      ctx.moveTo(p[0], p[1]);
      for (let i = 1; i < v.length; i++) {
        p = this.toScreen(v[i].x, v[i].y);
        ctx.lineTo(p[0], p[1]);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else {
      const [x, y] = this.toScreen(b.position.x, b.position.y);
      const r = b.shape.radius * this.scale;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, 6.2832);
      ctx.fill();
      ctx.stroke();
      // Spoke, so rolling versus sliding is visible.
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + Math.cos(b.angle) * r, y - Math.sin(b.angle) * r);
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.stroke();
    }

    if (this.show.com && !b.isStatic) {
      const [x, y] = this.toScreen(b.position.x, b.position.y);
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(x - 1.5, y - 1.5, 3, 3);
    }
  }
}

function mixHex(a, b, t) {
  const pa = parseHex(a), pb = parseHex(b);
  if (!pa || !pb) return a;
  const c = pa.map((v, i) => Math.round(v + (pb[i] - v) * t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function parseHex(h) {
  if (typeof h !== 'string' || h[0] !== '#' || h.length !== 7) return null;
  return [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
}

/** Small rolling strip chart for the metrics panel. */
class Strip {
  constructor(canvas, color, label, opts = {}) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.color = color;
    this.label = label;
    this.data = [];
    this.max = opts.max || 0;
    this.log = !!opts.log;
    this.n = opts.n || 240;
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
  }
  push(v) {
    this.data.push(v);
    if (this.data.length > this.n) this.data.shift();
  }
  reset() { this.data.length = 0; }
  draw(unit = '') {
    const c = this.canvas, ctx = this.ctx;
    const r = c.getBoundingClientRect();
    if (c.width !== Math.round(r.width * this.dpr)) {
      c.width = Math.round(r.width * this.dpr);
      c.height = Math.round(r.height * this.dpr);
    }
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    const w = r.width, h = r.height;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    ctx.fillRect(0, 0, w, h);

    let peak = this.max;
    for (const v of this.data) if (v > peak) peak = v;
    if (peak <= 0) peak = 1;

    ctx.strokeStyle = this.color;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (let i = 0; i < this.data.length; i++) {
      const x = (i / (this.n - 1)) * w;
      const t = this.log ? Math.log10(1 + 9 * this.data[i] / peak) : this.data[i] / peak;
      const y = h - t * (h - 3) - 1.5;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    ctx.fillStyle = 'rgba(220,228,242,0.75)';
    ctx.font = '10px ui-monospace, Menlo, monospace';
    ctx.fillText(`${this.label}  peak ${fmt(peak)}${unit}`, 5, 11);
  }
}

function fmt(v) {
  if (v === 0) return '0';
  if (Math.abs(v) >= 100) return v.toFixed(0);
  if (Math.abs(v) >= 1) return v.toFixed(2);
  return v.toPrecision(2);
}

// ===== src/app/ui.js =====
// The interactive harness: fixed-timestep loop, controls, HUD, mouse handling.
// Engine-agnostic — it only touches the World API that both engines implement,
// so the two pages are identical apart from which solver is compiled in.




const FIXED_DT = 1 / 60;

function boot(World, opts = {}) {
  const canvas = document.getElementById('view');
  const renderer = new Renderer(canvas);
  const world = new World();

  const state = {
    running: true,
    sceneKey: sceneKeys[0],
    speed: 1,
    accumulator: 0,
    lastTime: performance.now(),
    stepMs: 0,
    frameMs: 0,
    fps: 0,
    apex0: 0,
    simTime: 0,
    stepCount: 0,
    drag: null,
    pan: null,
  };

  const strips = {
    pen: new Strip(document.getElementById('strip-pen'), '#ff9f68', 'max overlap (mm)'),
    energy: new Strip(document.getElementById('strip-energy'), '#79c7ff', 'kinetic energy (J)'),
    cost: new Strip(document.getElementById('strip-cost'), '#8ce99a', 'step cost (ms)'),
  };

  // -- scene handling --------------------------------------------------------

  function loadScene(key) {
    state.sceneKey = key;
    const s = buildScene(world, key);
    renderer.fitTo(s.view);
    state.apex0 = measure(world).apexHeight;
    state.simTime = 0;
    state.stepCount = 0;
    for (const k in strips) strips[k].reset();
    document.getElementById('scene-blurb').textContent = s.blurb;
    document.getElementById('btn-perturb').textContent = s.perturbLabel;
    return s;
  }

  // -- UI construction -------------------------------------------------------

  const sceneSelect = document.getElementById('scene');
  for (const k of sceneKeys) {
    const o = document.createElement('option');
    o.value = k; o.textContent = scenes[k].name;
    sceneSelect.appendChild(o);
  }
  sceneSelect.addEventListener('change', () => loadScene(sceneSelect.value));

  document.getElementById('btn-play').addEventListener('click', (e) => {
    state.running = !state.running;
    e.target.textContent = state.running ? 'Pause' : 'Play';
  });
  document.getElementById('btn-step').addEventListener('click', () => {
    state.running = false;
    document.getElementById('btn-play').textContent = 'Play';
    doStep();
  });
  document.getElementById('btn-reset').addEventListener('click', () => loadScene(state.sceneKey));
  document.getElementById('btn-perturb').addEventListener('click', () => {
    scenes[state.sceneKey].perturb(world);
  });

  const paramHost = document.getElementById('params');
  for (const p of World.params) {
    paramHost.appendChild(makeControl(world, p));
  }
  // Shared knobs, identical in both builds.
  paramHost.appendChild(makeControl(world, { key: 'allowSleep', label: 'Sleeping', type: 'bool' }));
  paramHost.appendChild(makeControl(world.gravity, { key: 'y', label: 'Gravity (m/s²)', min: -20, max: 0, step: 0.1 }));

  const debugHost = document.getElementById('debug');
  for (const [key, label] of [['contacts', 'Contact points'], ['normals', 'Contact normals'],
                              ['impulses', 'Normal impulse magnitude'], ['aabb', 'AABBs'], ['com', 'Centres of mass']]) {
    debugHost.appendChild(makeControl(renderer.show, { key, label, type: 'bool' }));
  }

  const speedSel = document.getElementById('speed');
  speedSel.addEventListener('change', () => { state.speed = parseFloat(speedSel.value); });

  // -- mouse -----------------------------------------------------------------

  canvas.addEventListener('pointerdown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const p = renderer.toWorld(e.clientX - rect.left, e.clientY - rect.top);
    if (e.button === 1 || e.shiftKey) {
      state.pan = { x: e.clientX, y: e.clientY, cx: renderer.camera.x, cy: renderer.camera.y };
      canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (e.altKey) {
      const b = e.ctrlKey
        ? makeCircle(p.x, p.y, 0.14, { density: 3, friction: 0.5, color: '#c94f4f' })
        : makeBox(p.x, p.y, 0.14, 0.14, { friction: 0.5, color: '#7f9cc9' });
      world.addBody(b);
      world.wakeAll();
      return;
    }
    const body = pick(world, p);
    if (body) {
      state.drag = { body, target: p, offset: { x: p.x - body.position.x, y: p.y - body.position.y } };
      world.wakeAll();
      canvas.setPointerCapture(e.pointerId);
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    const rect = canvas.getBoundingClientRect();
    if (state.pan) {
      const s = renderer.scale;
      renderer.camera.x = state.pan.cx - (e.clientX - state.pan.x) / s;
      renderer.camera.y = state.pan.cy + (e.clientY - state.pan.y) / s;
      return;
    }
    if (state.drag) state.drag.target = renderer.toWorld(e.clientX - rect.left, e.clientY - rect.top);
  });

  const endPointer = () => { state.drag = null; state.pan = null; };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const f = Math.exp(e.deltaY * 0.0012);
    renderer.camera.height = Math.min(30, Math.max(0.4, renderer.camera.height * f));
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.code === 'Space') { e.preventDefault(); document.getElementById('btn-play').click(); }
    if (e.code === 'KeyR') loadScene(state.sceneKey);
    if (e.code === 'KeyP') document.getElementById('btn-perturb').click();
    if (e.code === 'Period') document.getElementById('btn-step').click();
  });

  /**
   * Dragging applies a critically-damped impulse towards the cursor rather than
   * teleporting the body. Teleporting would inject arbitrary constraint error,
   * which is exactly what these engines are being measured on.
   */
  function applyDrag() {
    const d = state.drag;
    if (!d || d.body.isStatic) return;
    const b = d.body;
    const px = b.position.x + d.offset.x, py = b.position.y + d.offset.y;
    const k = 24, c = 6;
    const fx = (d.target.x - px) * k - b.linearVelocity.x * c;
    const fy = (d.target.y - py) * k - b.linearVelocity.y * c;
    b.applyForce(fx / b.invMass, fy / b.invMass);
    b.wake();
  }

  // -- main loop -------------------------------------------------------------

  function doStep() {
    applyDrag();
    const t0 = performance.now();
    world.step(FIXED_DT);
    state.stepMs = state.stepMs * 0.9 + (performance.now() - t0) * 0.1;
    state.simTime += FIXED_DT;
    state.stepCount++;
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - state.lastTime) / 1000);
    state.lastTime = now;
    state.fps = state.fps * 0.9 + (1 / Math.max(dt, 1e-4)) * 0.1;

    if (state.running) {
      // Fixed timestep with an accumulator: the physics is identical whatever
      // the display refresh rate, which is what makes the two pages comparable.
      state.accumulator += dt * state.speed;
      let guard = 0;
      while (state.accumulator >= FIXED_DT && guard++ < 8) {
        state.accumulator -= FIXED_DT;
        doStep();
      }
      if (guard >= 8) state.accumulator = 0;   // give up rather than spiral
    }

    renderer.resize();
    renderer.draw(world);
    updateHud();
    requestAnimationFrame(frame);
  }

  const hudRows = {};
  function hud(label, value) {
    if (!hudRows[label]) {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<span>${label}</span><b></b>`;
      document.getElementById('hud').appendChild(row);
      hudRows[label] = row.querySelector('b');
    }
    hudRows[label].textContent = value;
  }

  let hudTick = 0;
  function updateHud() {
    const s = world.stats;
    if (state.stepCount % 2 === 0) {
      strips.pen.push(s.maxPenetration * 1000);
      strips.energy.push(s.energy);
      strips.cost.push(s.totalMs);
    }
    if (hudTick++ % 6 !== 0) return;

    const m = measure(world);
    hud('display fps', state.fps.toFixed(0));
    hud('sim time', state.simTime.toFixed(2) + ' s');
    hud('bodies', `${s.bodies} (${s.sleeping} asleep)`);
    hud('contacts / points', `${s.contacts} / ${s.points}`);
    hud('step cost', `${state.stepMs.toFixed(3)} ms`);
    hud('  broad / narrow', `${s.broadMs.toFixed(3)} / ${s.narrowMs.toFixed(3)} ms`);
    hud('  solve / position', `${s.solveMs.toFixed(3)} / ${s.positionMs.toFixed(3)} ms`);
    hud('max overlap', `${(s.maxPenetration * 1000).toFixed(3)} mm`);
    hud('mean overlap', `${(s.avgPenetration * 1000).toFixed(3)} mm`);
    hud('kinetic energy', `${s.energy.toFixed(4)} J`);
    hud('apex height', `${m.apexHeight.toFixed(3)} m  (${((m.apexHeight - state.apex0) * 1000).toFixed(0)} mm)`);
    hud('max displacement', `${(m.maxDisplacement * 1000).toFixed(1)} mm`);
    hud('bodies moving', `${m.movingBodies}`);

    strips.pen.draw(' mm');
    strips.energy.draw(' J');
    strips.cost.draw(' ms');
  }

  document.getElementById('engine-name').textContent = world.name;
  document.title = `${world.name} — 2D rigid body demo`;
  if (opts.accent) document.documentElement.style.setProperty('--accent', opts.accent);

  loadScene(state.sceneKey);
  sceneSelect.value = state.sceneKey;
  renderer.resize();
  requestAnimationFrame(frame);

  // Handy for poking at the sim from the console.
  window.demo = { world, renderer, state, loadScene, scenes };
}

/** Topmost body whose shape contains the point. */
function pick(world, p) {
  for (let i = world.bodies.length - 1; i >= 0; i--) {
    const b = world.bodies[i];
    if (b.isStatic) continue;
    if (b.shape.type === 'circle') {
      if (Math.hypot(p.x - b.position.x, p.y - b.position.y) <= b.shape.radius) return b;
    } else {
      let inside = true;
      const v = b.worldVerts, n = b.worldNormals;
      for (let k = 0; k < v.length; k++) {
        if (n[k].x * (p.x - v[k].x) + n[k].y * (p.y - v[k].y) > 0) { inside = false; break; }
      }
      if (inside) return b;
    }
  }
  return null;
}

function makeControl(target, p, onChange) {
  const wrap = document.createElement('label');
  wrap.className = 'ctl';
  if (p.type === 'bool') {
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = !!target[p.key];
    input.addEventListener('change', () => { target[p.key] = input.checked; if (onChange) onChange(); });
    wrap.appendChild(input);
    const span = document.createElement('span');
    span.textContent = p.label;
    wrap.appendChild(span);
    return wrap;
  }
  const head = document.createElement('span');
  const val = document.createElement('b');
  const fmt = (v) => (p.step >= 1 ? v.toFixed(0) : String(+v.toFixed(6)));
  head.textContent = p.label;
  val.textContent = fmt(target[p.key]);
  const input = document.createElement('input');
  input.type = 'range';
  input.min = p.min; input.max = p.max; input.step = p.step;
  input.value = target[p.key];
  input.addEventListener('input', () => {
    target[p.key] = parseFloat(input.value);
    val.textContent = fmt(target[p.key]);
    if (onChange) onChange();
  });
  const row = document.createElement('div');
  row.className = 'ctl-head';
  row.appendChild(head); row.appendChild(val);
  wrap.appendChild(row);
  wrap.appendChild(input);
  return wrap;
}

boot(World, { accent: "#ffd166" });
})();
