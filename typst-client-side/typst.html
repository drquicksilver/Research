<style>

  .diag.warning .sev { color: var(--warning); }

    background: var(--preview-bg);

  .bar div { height: 100%; width: 0; background: var(--accent); transition: width 0.2s; }
  footer {

  @media (max-width: 760px) {

// ============================================================
//  A tour of Typst, compiled entirely in your browser.
//  Edit anything on the left - the preview updates as you type.

// ---------- Document set-up: metadata, page, text ----------
#set document(
  title: [A Tour of Typst],
  author: "Typst in the Browser",
  keywords: ("typst", "wasm", "demo"),
)

#let accent = rgb("#239dad")
#let ink = luma(25%)

#set page(
  paper: "a4",
  margin: (x: 2.2cm, top: 2.6cm, bottom: 2.4cm),
  header: context {
    // Introspection: no header on the title page.
    if here().page() > 1 {
      set text(8pt, fill: ink)
      smallcaps[A Tour of Typst]
      h(1fr)
      // The section starting on this page, else the last one before it.
      let all = query(heading.where(level: 1))
      let here-page = all.filter(h => h.location().page() == here().page())
      let before = all.filter(h => h.location().page() < here().page())
      if here-page.len() > 0 { here-page.first().body } else if before.len() > 0 { before.last().body }
      v(-4pt)
      line(length: 100%, stroke: 0.4pt + ink)
    }
  },
  numbering: "1 / 1",
  number-align: center,
)

#set text(font: "Libertinus Serif", size: 10.5pt, lang: "en")
#set par(justify: true, leading: 0.62em)
#set heading(numbering: "1.1")
#set math.equation(numbering: "(1)")
#set figure(gap: 0.8em)
#show link: set text(fill: accent)

// ---------- Show rules: restyle elements ----------
#show heading.where(level: 1): it => {
  pagebreak(weak: true)
  set text(size: 20pt, weight: "bold", fill: accent)
  block(below: 1em)[
    #if it.numbering != none [
      #text(fill: ink.lighten(40%))[#counter(heading).display()]
      #h(0.4em)
    ]
    #it.body
  ]
}
#show heading.where(level: 2): set text(fill: ink, size: 13pt)
#show raw.where(block: true): block.with(
  fill: luma(96%),
  inset: 8pt,
  radius: 4pt,
  width: 100%,
)
#show raw.where(block: false): box.with(
  fill: luma(94%),
  inset: (x: 3pt),
  outset: (y: 3pt),
  radius: 2pt,
)
// Text show rule: every "Typst" gets the brand colour.
#show "Typst": name => text(fill: accent, weight: "semibold", name)

// ---------- Reusable components (functions!) ----------
#let callout(title: "Note", color: accent, body) = block(
  width: 100%,
  inset: 10pt,
  radius: 4pt,
  fill: color.lighten(88%),
  stroke: (left: 3pt + color),
)[
  #text(weight: "bold", fill: color.darken(20%), title) \
  #body
]

#let demo(code) = grid(
  columns: (1fr, 1fr),
  gutter: 10pt,
  align: horizon,
  raw(code.text, lang: "typ", block: true),
  block(inset: 8pt, stroke: 0.5pt + luma(80%), radius: 4pt, width: 100%,
    eval(code.text, mode: "markup")),
)

// ============================================================

  #place(top, rect(
    width: 100%,
    height: 62%,
    fill: gradient.linear(accent, rgb("#16214a"), angle: 60deg),

    place(top + left, dx: x, dy: y,

= Markup <markup>

Typst's markup is designed to be as light as Markdown while being as
capable as LaTeX. Text can be _emphasised_, *strong*, or *_both_*. You can
write `inline code`, #underline[underline], #strike[strike through],
#overline[overline], #highlight[highlight], #smallcaps[Small Caps],
super#super[script] and sub#sub[script]. "Smart quotes" are 'automatic', as
are en--dashes, em---dashes and ellipses...

Links are written inline: https://typst.app, or with custom text:
#link("https://github.com/Myriad-Dreamin/typst.ts")[typst.ts on GitHub].
A line can be broken manually \
like this, and special characters like \#, \$ and \* are escaped with a
backslash. Unicode escapes work too: \u{1F600} is U+1F600.#footnote[Footnotes
are created with the `footnote` function and placed automatically at the
bottom of the page.]

= Mathematics <maths>

Inline maths like $e^(i pi) + 1 = 0$ sits in the text, while display maths
gets its own line and, here, a number:

$ integral_(-oo)^oo e^(-x^2) dif x = sqrt(pi) $ <gauss>

@gauss is the Gaussian integral. Typst understands fractions, roots,
sums, products and limits:

$ sum_(k=1)^n k = (n(n+1)) / 2 quad
  product_(p "prime") 1 / (1 - p^(-s)) = zeta(s) quad
  lim_(x -> 0) (sin x) / x = 1 $

== Alignment, cases and matrices

$ f(x) &= (x + 1)^2 \
       &= x^2 + 2x + 1 $

$ |x| = cases(
    x & "if" x >= 0,
    -x & "otherwise",
  ) quad
  A = mat(1, 2, 3; 4, 5, 6; 7, 8, 9) quad
  det mat(a, b; c, d; delim: "|") = a d - b c $

$ vec(x_1, x_2, x_3) dot.op vec(y_1, y_2, y_3) = sum_i x_i y_i quad
  nabla times bold(E) = - (partial bold(B)) / (partial t) $

== Symbols, styles and decorations

$ alpha, beta, Gamma, Delta, aleph_0, planck, ell, nabla, partial, infinity $
$ NN subset ZZ subset QQ subset RR subset CC quad
  cal(L), frak(g), sans(A), mono(x), bb(1) $
$ hat(x), tilde(y), dot(z), arrow(v), overline(A B), x', f''(t) $
$ underbrace(1 + 2 + dots.c + n, n "terms") quad
  overbrace(a + b, "sum") quad cancel(x) / cancel(x) = 1 $
$ lr(chevron.l psi | phi.alt chevron.r) quad
  lr([ sum_(i=0)^n a_i ], size: #150%) quad
  A arrow.r.long B arrow.squiggly C $

#callout(title: "Maths font")[

== A real programming language

Typst has variables, functions, closures, loops, conditionals, arrays,
dictionaries, strings, regular expressions and a maths library:

#let fib(n) = if n < 2 { n } else { fib(n - 1) + fib(n - 2) }
#let squares = range(1, 11).map(x => x * x)
#let person = (name: "Ada", born: 1815, field: "mathematics")

#table(
  columns: (auto, 1fr),
  stroke: none,
  row-gutter: 2pt,
  [`fib(20)`], [#fib(20)],
  [`squares`], [#squares.map(str).join(", ")],
  [`squares.filter(calc.even).sum()`], [#squares.filter(calc.even).sum()],
  [`person.name + " " + str(person.born)`], [#(person.name + " " + str(person.born))],
  [`calc.pow(2, 62)`], [#calc.pow(2, 62)],
  [`calc.round(calc.pi, digits: 6)`], [#calc.round(calc.pi, digits: 6)],
  [`"Hello world".split(" ").rev()`], [#repr("Hello world".split(" ").rev())],
  [`"a1b22c333".matches(regex("\d+"))`], [#"a1b22c333".matches(regex("\d+")).map(m => m.text).join(", ")],
  [`upper("typst")`], [#upper("typst")],
  [`numbering("I", 2026)`], [#numbering("I", 2026)],
  [`datetime.today()` _(type)_], [#type(datetime.today())],
)

Loops can produce content directly:

#for (i, colour) in (red, orange, yellow, green, blue, purple).enumerate() {
  box(circle(radius: 6pt + i * 1.5pt, fill: colour))
  h(4pt)
}

#let (x, y, ..rest) = (1, 2, 3, 4, 5)
Destructuring: `x = #x`, `y = #y`, `rest = #repr(rest)`.

== Data files

Typst can parse CSV, JSON, YAML, TOML and XML. Here a CSV string is
turned into a table and a bar chart built from plain boxes:

#let sales = csv(bytes("quarter,sales
Q1,42
Q2,67
Q3,58
Q4,91"), row-type: dictionary)

#let config = json(bytes(`{"product": "Widgets", "currency": "£"}`.text))

#figure(
  grid(
    columns: (auto, 1fr),
    gutter: 20pt,
    align: bottom,
    table(
      columns: 2,
      table.header[*Quarter*][*Sales*],
      ..sales.map(r => (r.quarter, config.currency + r.sales)).flatten()
    ),
    stack(
      dir: ltr,
      spacing: 8pt,
      ..sales.map(r => stack(
        spacing: 3pt,
        align(center, text(8pt, r.sales)),
        rect(width: 28pt, height: int(r.sales) * 1pt,
          fill: gradient.linear(accent, accent.darken(40%), angle: 90deg)),
        align(center, text(8pt, r.quarter)),
      ))
    ),
  ),
  caption: [#config.product sales, read from inline CSV and JSON.],
)

</svg>

== Counters and state

Custom counters and state can be updated and read anywhere in the
document. This document has
#context counter(heading).final().first() top-level sections,
#context counter(figure.where(kind: table)).final().first() tables and
#context counter(math.equation).final().first() numbered equation(s).

#let theorem = counter("theorem")
#let thm(body) = block(inset: 8pt, stroke: (left: 2pt + ink), width: 100%)[
  #theorem.step()
  *Theorem #context theorem.display().* #body
]

#thm[There are infinitely many primes.]
#thm[$sqrt(2)$ is irrational.]

#let mood = state("mood", "curious")
The state starts #context mood.get(),
#mood.update("delighted")
and becomes #context mood.get().

#context {

= Bibliography & Citations <bib>

Citations are written with `@key` or `#cite`: Typst was introduced in a
master's thesis @madje2022. Knuth's _TeXbook_ @knuth1984 and Lamport's
manual @lamport1994 describe its predecessors, and the citation style can
be changed with a single argument #cite(<knuth1984>, form: "prose").

<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script type="module">
import {
  $typst,
  loadFonts,
} from 'https://cdn.jsdelivr.net/npm/@myriaddreamin/typst.ts@0.7.0/dist/esm/contrib/all-in-one-lite.bundle.js';

const COMPILER_WASM = 'https://cdn.jsdelivr.net/npm/@myriaddreamin/typst-ts-web-compiler@0.7.0/pkg/typst_ts_web_compiler_bg.wasm';
const RENDERER_WASM = 'https://cdn.jsdelivr.net/npm/@myriaddreamin/typst-ts-renderer@0.7.0/pkg/typst_ts_renderer_bg.wasm';
const FONT_BASE = 'https://cdn.jsdelivr.net/gh/typst/typst-assets@v0.14.2/files/fonts/';
// Typst's default text, maths and code fonts (the same set the typst CLI embeds).
const FONTS = [
  'LibertinusSerif-Regular.otf', 'LibertinusSerif-Italic.otf',
  'LibertinusSerif-Bold.otf', 'LibertinusSerif-BoldItalic.otf',
  'LibertinusSerif-Semibold.otf', 'LibertinusSerif-SemiboldItalic.otf',
  'NewCM10-Regular.otf', 'NewCM10-Italic.otf', 'NewCM10-Bold.otf', 'NewCM10-BoldItalic.otf',
  'NewCMMath-Regular.otf', 'NewCMMath-Book.otf', 'NewCMMath-Bold.otf',
  'DejaVuSansMono.ttf', 'DejaVuSansMono-Oblique.ttf',
  'DejaVuSansMono-Bold.ttf', 'DejaVuSansMono-BoldOblique.ttf',
];
const MAIN = '/main.typ';

const $ = id => document.getElementById(id);
const source = $('source');
const gutter = $('gutter');
const statusEl = $('status');
const diagnosticsEl = $('diagnostics');
const preview = $('preview');

const EXAMPLES = {
  tour: () => $('demo-source').textContent.replace(/^\n/, ''),
  hello: () => `#set page(width: 12cm, height: auto, margin: 1cm)
#set text(size: 12pt)

= Hello, Typst!

This document was typeset *in your browser*.
Try editing it: the preview updates as you type.

$ sum_(n=1)^oo 1/n^2 = pi^2/6 $
`,
  maths: () => `#set page(width: 16cm, height: auto, margin: 1.2cm)
#set math.equation(numbering: "(1)")
#set text(font: "New Computer Modern")

= Maths sheet

$ x_(1,2) = (-b plus.minus sqrt(b^2 - 4 a c)) / (2 a) $
$ e^x = sum_(n=0)^oo x^n / n! = 1 + x + x^2/2! + x^3/3! + dots.c $
$ hat(f)(xi) = integral_(-oo)^oo f(x) e^(-2 pi i x xi) dif x $
$ mat(
  cos theta, -sin theta;
  sin theta, cos theta;
) vec(x, y) = vec(x cos theta - y sin theta, x sin theta + y cos theta) $
$ P(A | B) = (P(B | A) P(A)) / P(B) $
`,
  package: () => `// Packages are downloaded on demand from packages.typst.org.
#import "@preview/showybox:2.0.4": showybox

#set page(width: 14cm, height: auto, margin: 1cm)

#showybox(
  title: "A package from Typst Universe",
  frame: (border-color: blue, title-color: blue.lighten(30%), body-color: blue.lighten(95%)),
)[
  This box comes from the *showybox* package, fetched as a tarball
  and unpacked by the compiler running in your browser.
]
`,
};

// ---------- URL fragment encoding ----------
// "#z=" + base64url(raw deflate), using a preset dictionary of common Typst
// fragments so even short documents compress well. "#src=" holds plain text.
// The dictionary is part of the link format: never change it, add "#z2=" instead.
const DICTIONARY = new TextEncoder().encode(
  'columns: rows: gutter: inset: stroke: fill: width: height: radius: align(center)' +
  ' #set page(margin: paper: "a4" numbering: "1" header: footer: #set par(justify: true)' +
  ' #set heading(numbering: "1.1") #show heading: it => #set text(font: size: weight: "bold"' +
  ' lang: "en" #let #import "@preview/ #include #figure(caption: [ #table( #grid( #image(' +
  ' #box( #block( #rect( #circle( #line( #place( #align( #stack( dir: ltr spacing: #v( #h(1fr)' +
  ' #pagebreak() #outline() #bibliography( #cite( #footnote[ #link(" #lorem( #context ' +
  'counter( query( state( #for in range( #if else { } return none auto true false' +
  ' rgb("# luma( gradient.linear( .lighten( .darken( 100% 1fr 1em 1cm 2pt 10pt 12pt' +
  ' $ sum_(i=1)^n integral_ dif x frac( sqrt( mat( vec( cases( alpha beta gamma pi theta' +
  ' lambda sigma omega infinity arrow.r dots.c quad #set math.equation(numbering: "(1)") $ ' +
  '= Introduction\n\n== \n- \n+ *bold* _emph_ `code` ```\n'
);
const b64url = bytes => {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
};
const unb64url = str => {
  const s = atob(str.replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(s, c => c.charCodeAt(0));
};
function encodeSource(text) {
  return 'z=' + b64url(pako.deflateRaw(new TextEncoder().encode(text), { level: 9, dictionary: DICTIONARY }));
}
function decodeHash(hash) {
  const h = hash.replace(/^#/, '');
  if (h.startsWith('z=')) {
    return new TextDecoder().decode(pako.inflateRaw(unb64url(h.slice(2)), { dictionary: DICTIONARY }));
  }
  if (h.startsWith('src=')) return decodeURIComponent(h.slice(4));
  return null;
}

// ---------- Editor ----------
function updateGutter() {
  const lines = source.value.split('\n').length;
  if (gutter.dataset.lines == lines) return;
  gutter.dataset.lines = lines;
  gutter.textContent = Array.from({ length: lines }, (_, i) => i + 1).join('\n');
}
source.addEventListener('scroll', () => { gutter.scrollTop = source.scrollTop; });
source.addEventListener('keydown', e => {
  if (e.key === 'Tab' && !e.metaKey && !e.ctrlKey && !e.altKey) {
    e.preventDefault();
    document.execCommand('insertText', false, '  ');
  }
});
function jumpTo(line, col) {
  const lines = source.value.split('\n');
  let offset = 0;
  for (let i = 0; i < line - 1 && i < lines.length; i++) offset += lines[i].length + 1;
  offset += Math.max(0, col - 1);
  source.focus();
  source.setSelectionRange(offset, offset);
  const lineHeight = parseFloat(getComputedStyle(source).lineHeight);
  source.scrollTop = Math.max(0, (line - 5) * lineHeight);
}

// ---------- Preview ----------
preview.srcdoc = `<!DOCTYPE html><html><head><meta charset="utf-8"><base target="_blank">
<style>
  html, body { margin: 0; background: transparent; }
  body { padding: 16px; }
  #pages { max-width: 860px; margin: 0 auto; }
  #pages > svg { display: block; width: 100%; height: auto; overflow: visible; }
  /* White paper behind each page, added by layoutPages(). */
  .page-bg { fill: #fff; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3)); }
</style></head><body><div id="pages"></div></body></html>`;
const previewReady = new Promise(resolve => preview.addEventListener('load', resolve, { once: true }));

// typst.ts stacks the pages edge to edge on a transparent background. Spread them
// out and put a sheet of paper behind each one.
const PAGE_GAP = 14;
function layoutPages(svg) {
  let y = 0, width = 0;
  for (const g of svg.querySelectorAll('g.typst-page')) {
    const w = +g.dataset.pageWidth, h = +g.dataset.pageHeight;
    g.setAttribute('transform', `translate(0, ${y})`);
    const bg = svg.ownerDocument.createElementNS('http://www.w3.org/2000/svg', 'rect');
    Object.entries({ class: 'page-bg', x: 0, y, width: w, height: h }).forEach(([k, v]) => bg.setAttribute(k, v));
    g.before(bg);
    y += h + PAGE_GAP;
    width = Math.max(width, w);
  }
  if (y) {
    const height = y - PAGE_GAP;
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    svg.setAttribute('width', width);
    svg.setAttribute('height', height);
  }
}

let lastSvg = null;
async function showSvg(svg) {
  await previewReady;
  const pages = preview.contentDocument.getElementById('pages');
  pages.innerHTML = svg;
  const el = pages.querySelector('svg');
  if (el) layoutPages(el);
  lastSvg = svg;
}

// ---------- Loading with progress ----------
let loaded = 0;
function progress(bytes, label) {
  loaded += bytes;
  // fetch() reports decompressed bytes: ~38 MB in total (28 MB compiler wasm,
  // 1 MB renderer, 9 MB fonts), which is about 13 MB over the network.
  const TOTAL = 38.1e6;
  $('loading-bar').style.width = Math.min(100, (loaded / TOTAL) * 100) + '%';
  $('loading-detail').textContent =
    `${(loaded / 1e6).toFixed(1)} of ${(TOTAL / 1e6).toFixed(0)} MB${label ? ' · ' + label : ''} (cached after the first visit)`;
}
async function fetchBytes(url, label) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${res.status} fetching ${url}`);
  if (!res.body) {
    const buf = new Uint8Array(await res.arrayBuffer());
    progress(buf.length, label);
    return buf;
  }
  const reader = res.body.getReader();
  const chunks = [];
  let total = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    total += value.length;
    progress(value.length, label);
  }
  const out = new Uint8Array(total);
  let pos = 0;
  for (const c of chunks) { out.set(c, pos); pos += c.length; }
  return out;
}

let compiler, renderer;
async function init() {
  const t0 = performance.now();
  const [compilerWasm, rendererWasm, ...fonts] = await Promise.all([
    fetchBytes(COMPILER_WASM, 'compiler'),
    fetchBytes(RENDERER_WASM, 'renderer'),
    ...FONTS.map(f => fetchBytes(FONT_BASE + f, f)),
  ]);
  $('loading-text').textContent = 'Starting the compiler…';
  $typst.setCompilerInitOptions({
    getModule: () => compilerWasm,
    beforeBuild: [loadFonts(fonts, { assets: false })],
  });
  $typst.setRendererInitOptions({ getModule: () => rendererWasm });
  compiler = await $typst.getCompiler();
  renderer = await $typst.getRenderer();
  return performance.now() - t0;
}

// ---------- Compile ----------
function parseRange(range) {
  // "startLine:startCol-endLine:endCol", zero-based
  const m = /^(\d+):(\d+)/.exec(range || '');
  return m ? { line: +m[1] + 1, col: +m[2] + 1 } : null;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function showDiagnostics(diags) {
  diagnosticsEl.innerHTML = '';
  for (const d of diags) {
    const el = document.createElement('div');
    const sev = (d.severity || 'error').toLowerCase();
    el.className = 'diag ' + sev;
    const pos = d.path === MAIN || !d.path ? parseRange(d.range) : null;
    const where = d.path && d.path !== MAIN ? d.path : pos ? `${pos.line}:${pos.col}` : '';
    el.innerHTML = `<span class="sev">${escapeHtml(sev)}</span>` +
      (where ? `<span class="where">${escapeHtml(where)}</span>` : '') +
      escapeHtml(d.message) +
      (d.hints || []).map(h => `<div class="hint">hint: ${escapeHtml(h)}</div>`).join('');
    if (pos) el.addEventListener('click', () => jumpTo(pos.line, pos.col));
    diagnosticsEl.appendChild(el);
  }
}

let compiling = false, pending = false;
async function compile() {
  if (!compiler) return;
  if (compiling) { pending = true; return; }
  compiling = true;
  try {
    const t0 = performance.now();
    compiler.addSource(MAIN, source.value);
    const { result, diagnostics = [] } = await compiler.compile({ mainFilePath: MAIN, diagnostics: 'full' });
    const t1 = performance.now();
    showDiagnostics(diagnostics);
    const errors = diagnostics.filter(d => (d.severity || '').toLowerCase() === 'error').length;
    if (result) {
      const svg = await renderer.runWithSession(async session => {
        renderer.manipulateData({ renderSession: session, action: 'reset', data: result });
        return renderer.renderSvg({
          renderSession: session,
          data_selection: { body: true, defs: true, css: true, js: false },
        });
      });
      await showSvg(svg);
      const pages = (svg.match(/class="typst-page"/g) || []).length;
      const t2 = performance.now();
      setStatus(`Compiled in ${Math.round(t1 - t0)} ms, rendered in ${Math.round(t2 - t1)} ms` +
        (pages ? ` · ${pages} page${pages === 1 ? '' : 's'}` : '') +
        (diagnostics.length ? ` · ${diagnostics.length} warning${diagnostics.length === 1 ? '' : 's'}` : ''));
      $('download-pdf').disabled = $('download-svg').disabled = false;
    } else {
      setStatus(`${errors || diagnostics.length} error${(errors || diagnostics.length) === 1 ? '' : 's'}; showing the last good render`, true);
    }
  } catch (e) {
    console.error(e);
    setStatus('Compiler error: ' + (e.message || e), true);
  } finally {
    compiling = false;
    if (pending) { pending = false; compile(); }
  }
}
function setStatus(text, isError = false) {
  statusEl.textContent = text;
  statusEl.title = text;
  statusEl.classList.toggle('error', isError);
}

let compileTimer, hashTimer;
source.addEventListener('input', () => {
  updateGutter();
  clearTimeout(compileTimer);
  compileTimer = setTimeout(compile, 250);
  clearTimeout(hashTimer);
  hashTimer = setTimeout(() => history.replaceState(null, '', '#' + encodeSource(source.value)), 600);
});

function setSource(text, { updateHash = true } = {}) {
  source.value = text;
  source.scrollTop = 0;
  updateGutter();
  if (updateHash) history.replaceState(null, '', '#' + encodeSource(text));
  compile();
}

// ---------- Toolbar ----------
function download(data, name, type) {
  const url = URL.createObjectURL(new Blob([data], { type }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function baseName() {
  const m = /title:\s*(?:\[([^\]\n]+)\]|"([^"\n]+)")/.exec(source.value);
  const t = m ? (m[1] || m[2]) : 'document';
  return t.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() || 'document';
}
$('download-pdf').addEventListener('click', async () => {
  compiler.addSource(MAIN, source.value);
  const { result } = await compiler.compile({ mainFilePath: MAIN, format: 1, diagnostics: 'none' });
  if (result) download(result, baseName() + '.pdf', 'application/pdf');
  else setStatus('Fix the errors before exporting a PDF', true);
});
$('download-svg').addEventListener('click', () => {
  if (lastSvg) download(lastSvg, baseName() + '.svg', 'image/svg+xml');
});
$('download-typ').addEventListener('click', () => download(source.value, baseName() + '.typ', 'text/plain'));
$('copy-link').addEventListener('click', async e => {
  const url = location.href.split('#')[0] + '#' + encodeSource(source.value);
  history.replaceState(null, '', url);
  try {
    await navigator.clipboard.writeText(url);
    e.target.textContent = `Copied (${(url.length / 1024).toFixed(1)} KB)`;
  } catch {
    e.target.textContent = 'Link is in the address bar';
  }
  setTimeout(() => { e.target.textContent = 'Copy link'; }, 2000);
});
$('examples').addEventListener('change', e => {
  const key = e.target.value;
  e.target.value = '';
  if (!key) return;
  if (source.value.trim() && !confirm('Replace the current document with this example?')) return;
  setSource(EXAMPLES[key]());
});
window.addEventListener('hashchange', () => {
  const text = decodeHash(location.hash);
  if (text != null && text !== source.value) setSource(text, { updateHash: false });
});

// ---------- Start ----------
let initial = null;
try { initial = decodeHash(location.hash); } catch (e) { console.error('Could not decode URL fragment', e); }
source.value = initial ?? EXAMPLES.tour();
updateGutter();

try {
  const ms = await init();
  $('loading').hidden = true;
  setStatus(`Compiler ready in ${(ms / 1000).toFixed(1)} s`);
  await compile();
} catch (e) {
  console.error(e);
  $('loading-text').textContent = 'Could not load the Typst compiler';
  $('loading-detail').textContent = e.message || String(e);
  setStatus('Failed to load: ' + (e.message || e), true);
}

// Expose for debugging and automated tests.
window.typstApp = { compile, setSource, encodeSource, decodeHash, get svg() { return lastSvg; } };
</script>
