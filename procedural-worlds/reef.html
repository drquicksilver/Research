<!doctype html>
<!--
  REEF — gliding a few metres above a sunlit seabed as coral colonies grow out of the sand
  ahead of you: staghorn thickets, sea fans, tables, pillar clumps and sunburst domes.

  Concept   Growth, not placement. Each colony is only a cloud of "food" points in a rough
            envelope and a single root; the branching architecture comes from competition
            between growing tips for that food (space colonisation), and the trunk-to-twig
            thickness from counting what each branch carries (a pipe model). The glide never
            ends; new colonies keep seeding in front and growing as they come into view.
  Technique Space colonisation in JS (per-colony spatial hash, kill/influence radii, tropism,
            duplicate guard) running against a frame-time budget. Nodes stream into RGBA32F
            textures; every node is one instance of a procedurally generated tapered capsule
            built in the vertex shader from gl_VertexID, which also animates new segments
            sprouting. Lighting: an orthographic sun shadow map with hardware PCF, animated
            ridged-noise caustics projected along the light, wrap ambient from the water
            colour, rim light, polyp texture. Rendered into a 4x MSAA half-float target whose
            alpha carries view distance; a post pass adds depth fog that brightens toward the
            surface, raymarched light shafts, ACES tone mapping and a grade. Marine snow drifts
            past. Seeded palettes for water and coral.
  Controls  drag = look around · click / R = new reef (seed in URL hash)
-->
<html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Reef</title>
<style>html,body{margin:0;height:100%;background:#062830;overflow:hidden}canvas{width:100%;height:100%;display:block;cursor:grab}
#h{position:fixed;left:0;right:0;bottom:22px;text-align:center;font:12px system-ui,sans-serif;letter-spacing:.12em;color:#fff;opacity:.5;transition:opacity 3s;pointer-events:none}</style></head>
<body><canvas></canvas><div id=h>drag to look · click or R for a new reef</div><script>
const C=document.querySelector('canvas'),gl=C.getContext('webgl2',{antialias:false,alpha:false});
function fail(m){document.body.innerHTML='<p style="color:#bcd;font:15px system-ui;padding:2em;max-width:40em">'+m+'</p>';throw Error(m)}
if(!gl)fail('Reef needs WebGL2, which this browser or GPU does not provide.');
if(!gl.getExtension('EXT_color_buffer_float'))fail('Reef needs floating-point render targets (EXT_color_buffer_float).');
setTimeout(()=>h.style.opacity=0,5000);
const COM=`uniform mat4 VP,LVP;uniform vec3 CP,LD,WU,WD;uniform float T;uniform highp sampler2DShadow SM;
uint hs(uvec3 q){q=q*1664525u+1013904223u;q.x+=q.y*q.z;q.y+=q.z*q.x;q.z+=q.x*q.y;q^=q>>16u;q.x+=q.y*q.z;q.y+=q.z*q.x;q.z+=q.x*q.y;return q.x;}
float hf(vec3 i){return float(hs(uvec3(ivec3(i)+90000)))/4294967295.;}
float vn(vec3 x){vec3 i=floor(x),f=x-i;f=f*f*(3.-2.*f);
 return mix(mix(mix(hf(i),hf(i+vec3(1,0,0)),f.x),mix(hf(i+vec3(0,1,0)),hf(i+vec3(1,1,0)),f.x),f.y),
  mix(mix(hf(i+vec3(0,0,1)),hf(i+vec3(1,0,1)),f.x),mix(hf(i+vec3(0,1,1)),hf(i+1.),f.x),f.y),f.z);}
float vn(vec2 x){return vn(vec3(x,.5));}
float sb(vec2 p){return .5*sin(p.x*.09+sin(p.y*.07)*1.5)*cos(p.y*.06)+.3*sin(p.y*.13+p.x*.05);}
float caus(vec2 p){float c=0.;for(int i=0;i<2;i++){float k=1.+float(i)*.8;vec2 q=p*.7*k+vec2(T*.13,-T*.1)*k;
 q+=vec2(vn(q*.5+T*.06),vn(q*.5-T*.05+5.))*1.8;c+=pow(1.-abs(vn(q)*2.-1.),8.);}return c;}
float shd(vec3 p,vec3 n){vec4 q=LVP*vec4(p+n*.04,1);vec3 s=q.xyz*.5+.5;float r=0.;vec2 e=vec2(1./2048.,0);
 for(int i=0;i<4;i++){vec2 o=(vec2(i&1,i>>1)-.5)*2.*e.x;r+=texture(SM,vec3(s.xy+o,s.z-.0015));}
 return any(greaterThan(abs(s.xy-.5),vec2(.5)))?1.:r*.25;}
vec3 light(vec3 p,vec3 n,vec3 al,float ao){
 float sh=shd(p,n),dl=max(dot(n,LD),0.),ca=caus(p.xz-LD.xz/LD.y*p.y);
 vec3 v=normalize(CP-p);
 vec3 l=vec3(1,.96,.86)*dl*sh*(.4+1.1*ca)*1.05+(mix(WD*1.5,WU,.5+.5*n.y)*.6+.12)*ao+WU*.35*pow(1.-max(dot(n,v),0.),3.)*ao;
 return al*l;}`;
function prog(v,f,d=''){const p=gl.createProgram();
 for(const[t,s]of[[gl.VERTEX_SHADER,v],[gl.FRAGMENT_SHADER,f]]){const x=gl.createShader(t);
  gl.shaderSource(x,'#version 300 es\nprecision highp float;precision highp int;precision highp sampler2D;\n'+d+s);gl.compileShader(x);
  if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))fail('Shader error: '+gl.getShaderInfoLog(x));gl.attachShader(p,x)}
 gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))fail(gl.getProgramInfoLog(p));
 const c={};p.u=n=>c[n]??=gl.getUniformLocation(p,n);return p}

// coral: one tapered capsule per node, from its parent to itself, sprouting over 1.2s
const CV=COM+`uniform sampler2D NT,AT;out vec3 vP,vN;flat out vec4 vA;
const ivec2 Q[6]=ivec2[6](ivec2(0,0),ivec2(1,0),ivec2(0,1),ivec2(1,0),ivec2(1,1),ivec2(0,1));
void main(){int i=gl_InstanceID,v=gl_VertexID,c=v%6,j=(v/6)%6+Q[c].x,rg=v/36+Q[c].y;
 vec4 n=texelFetch(NT,ivec2(i&255,i>>8),0),a=texelFetch(AT,ivec2(i&255,i>>8),0);int pi=int(a.x);
 vec4 pn=pi<0?n-vec4(0,.4,0,0):texelFetch(NT,ivec2(pi&255,pi>>8),0);float r0=pi<0?a.y:texelFetch(AT,ivec2(pi&255,pi>>8),0).y;
 float g=smoothstep(n.w,n.w+1.2,T),r1=a.y*g;vec3 p0=pn.xyz,p1=mix(p0,n.xyz,g),ax=normalize(n.xyz-p0+1e-5);
 vec3 u=normalize(cross(ax,abs(ax.y)<.95?vec3(0,1,0):vec3(1,0,0))),w=cross(ax,u);float an=float(j)*1.0472;
 vec3 rad=u*cos(an)+w*sin(an);float th=rg<2?0.:float(rg-1)*.7854;
 vec3 ce=rg==0?p0:p1+ax*r1*sin(th);float rr=rg==0?r0:r1*cos(th);
 vP=ce+rad*rr;vN=rad*cos(th)+ax*sin(th);
 vA=vec4(a.z,a.w,1.-smoothstep(.03,.14,a.y),1.-smoothstep(0.,6.,T-n.w));
#ifdef SHADOW
 gl_Position=LVP*vec4(vP,1);
#else
 gl_Position=VP*vec4(vP,1);
#endif
}`;
const PC=prog(CV,COM+`uniform vec3 PL[5];in vec3 vP,vN;flat in vec4 vA;out vec4 o;
void main(){vec3 n=normalize(vN),b=PL[int(vA.x)]*(.82+.36*vA.y),al=mix(b,mix(b,vec3(1,.97,.9),.6),vA.z);
 float po=vn(vP*26.),ao=mix(.25,1.,smoothstep(0.,3.,vP.y-sb(vP.xz)));al*=.72+.45*po;al=mix(vec3(dot(al,vec3(.33))),al,1.35);
 o=vec4(light(vP,n,al,ao*(.75+.25*po))+al*vA.w*vA.z*.5,distance(vP,CP));}`);
const PS=prog(CV,'out vec4 o;void main(){o=vec4(0);}','#define SHADOW\n');
// seabed grid around the camera
const PB=prog(COM+`uniform vec2 BO;out vec3 vP;void main(){int v=gl_VertexID,c=v%6,q=v/6;
 ivec2 k=ivec2(q%160,q/160)+Q[c];vec2 x=BO+(vec2(k)-vec2(55,80))*1.;vP=vec3(x.x,sb(x),x.y);gl_Position=VP*vec4(vP,1);}`
 .replace('void main','const ivec2 Q[6]=ivec2[6](ivec2(0,0),ivec2(1,0),ivec2(0,1),ivec2(1,0),ivec2(1,1),ivec2(0,1));void main'),
 COM+`uniform vec3 SA;in vec3 vP;out vec4 o;
float rip(vec2 p){return sin(dot(p,vec2(.8,.6))*5.+vn(p*.4)*7.)*.5+.5;}float bh(vec2 p){return sb(p)+.05*rip(p);}
void main(){vec2 p=vP.xz,e=vec2(.05,0);float rp=rip(p),h0=bh(p);vec3 n=normalize(vec3(h0-bh(p+e),e.x,h0-bh(p+e.yx)));
 vec3 al=SA*.5*(.8+.25*vn(p*2.3)+.1*rp)*(1.-.35*smoothstep(.75,.95,vn(p*9.)));
 o=vec4(light(vP,n,al,1.),distance(vP,CP));}`);
// marine snow
const PN=prog(COM+`uniform float PZ;out float a;void main(){uint i=uint(gl_VertexID);vec3 h=vec3(hs(uvec3(i,1,2)),hs(uvec3(i,3,4)),hs(uvec3(i,5,6)))/4294967295.,b=vec3(44,16,44);
 vec3 p=h*b+vec3(sin(T*.13+h.x*6.)*.6,-T*.09,cos(T*.11+h.z*6.)*.6),o=CP-b*.5;p=o+mod(p-o,b);
 gl_Position=VP*vec4(p,1);float z=gl_Position.w;gl_PointSize=clamp(PZ*(.6+h.y)/z,1.,5.);a=smoothstep(22.,4.,z)*smoothstep(.3,1.5,z)*(.3+.7*h.z);}`,
 COM+'in float a;out vec4 o;void main(){vec2 d=gl_PointCoord-.5;o=vec4((WU*.6+.5)*a*max(0.,1.-4.*dot(d,d))*.6,0);}');
// post: fog toward the water colour, light shafts, tone
const PP=prog('void main(){gl_Position=vec4(vec2(gl_VertexID&1,gl_VertexID>>1)*4.-1.,0,1);}',COM+`
uniform sampler2D SC;uniform vec2 R,FF;uniform vec3 CR,CU,CF;uniform float FA,DN;out vec4 o;
void main(){vec2 uv=gl_FragCoord.xy/R,nd=uv*2.-1.;vec4 s=texture(SC,uv);float d=s.a;
 vec3 rd=normalize(CR*nd.x/FF.x+CU*nd.y/FF.y+CF);
 vec3 wc=mix(WD,WU,smoothstep(-.7,.8,rd.y))+WU*.45*pow(max(dot(rd,LD),0.),5.);
 vec3 c=mix(s.rgb,wc,1.-exp(-d*DN));
 float tm=min(d,55.),j=hf(vec3(gl_FragCoord.xy,T*30.)),sh=0.;
 for(int i=0;i<12;i++){float t=(float(i)+j)/12.*tm;vec3 p=CP+rd*t;vec2 q=p.xz-LD.xz/LD.y*(p.y-14.);
  sh+=smoothstep(.45,.95,vn(vec3(q*.22,T*.05)))*exp(-t*DN*1.3)*smoothstep(-3.,9.,p.y);}
 c+=WU*sh*tm/12.*.09;
 c=c*(2.51*c+.03)/(c*(2.43*c+.59)+.14);c=pow(clamp(c,0.,1.),vec3(.4545));
 c=mix(c,c*c*(3.-2.*c),.3);c*=.5+.5*pow(16.*uv.x*uv.y*(1.-uv.x)*(1.-uv.y),.2);
 o=vec4(c*FA+(j-.5)/128.,1);}`);

// --- render targets -----------------------------------------------------------------
let W,H,MS,RB,DB,SCT;
function size(){const d=Math.min(devicePixelRatio||1,2);W=C.width=innerWidth*d|0;H=C.height=innerHeight*d|0;
 [RB,DB].forEach(b=>b&&gl.deleteRenderbuffer(b));RB=gl.createRenderbuffer();gl.bindRenderbuffer(gl.RENDERBUFFER,RB);
 const sm=Math.min(4,gl.getParameter(gl.MAX_SAMPLES));gl.renderbufferStorageMultisample(gl.RENDERBUFFER,sm,gl.RGBA16F,W,H);
 DB=gl.createRenderbuffer();gl.bindRenderbuffer(gl.RENDERBUFFER,DB);gl.renderbufferStorageMultisample(gl.RENDERBUFFER,sm,gl.DEPTH_COMPONENT24,W,H);
 MS=MS||gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,MS);gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.RENDERBUFFER,RB);
 gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,DB);
 if(SCT)gl.deleteTexture(SCT);SCT=tex(gl.RGBA16F,W,H,gl.RGBA,gl.HALF_FLOAT,gl.LINEAR);SCT.f=fbo(SCT)}
function tex(f,w,h,fm,ty,fl){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,f,w,h,0,fm,ty,null);
 for(const[k,v]of[[gl.TEXTURE_MIN_FILTER,fl],[gl.TEXTURE_MAG_FILTER,fl],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])gl.texParameteri(gl.TEXTURE_2D,k,v);return t}
function fbo(t,dep){const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,dep?gl.DEPTH_ATTACHMENT:gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);return f}
addEventListener('resize',size);size();
const SMT=tex(gl.DEPTH_COMPONENT24,2048,2048,gl.DEPTH_COMPONENT,gl.UNSIGNED_INT,gl.LINEAR),SMF=fbo(SMT,1);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_COMPARE_MODE,gl.COMPARE_REF_TO_TEXTURE);
const CAP=1<<16,NT=tex(gl.RGBA32F,256,256,gl.RGBA,gl.FLOAT,gl.NEAREST),AT=tex(gl.RGBA32F,256,256,gl.RGBA,gl.FLOAT,gl.NEAREST);

// --- growth ---------------------------------------------------------------------------
const N4=new Float32Array(CAP*4),A4=new Float32Array(CAP*4),DSC=new Int32Array(CAP),COL=new Int32Array(CAP);
const D=.22,DI=1.7,DK=.36;let cnt=0,dirty=0,auxDirty=0,cols=[],spawnX=0,acc=0,rnd;
const sb=(x,z)=>.5*Math.sin(x*.09+Math.sin(z*.07)*1.5)*Math.cos(z*.06)+.3*Math.sin(z*.13+x*.05);
const pz=x=>7*Math.sin(x*.021)+4*Math.sin(x*.047+1);
const key=(x,y,z)=>(x&1023)<<20|(y&1023)<<10|z&1023;
function addNode(c,x,y,z,p){if(cnt>=CAP)return;const i=cnt++;N4.set([x,y,z,acc],i*4);A4.set([p,.05*c.rs,c.ci,c.hr],i*4);DSC[i]=0;COL[i]=c.id;
 const k=key(Math.floor(x/DI),Math.floor(y/DI),Math.floor(z/DI));let l=c.g.get(k);if(!l)c.g.set(k,l=[]);l.push(i);
 for(let q=p,s=0;q>=0&&s<400;q=A4[q*4],s++){DSC[q]++;A4[q*4+1]=Math.min(.7,(.05+.026*Math.pow(DSC[q],.47))*c.rs)}auxDirty=1;c.mx=Math.max(c.mx,x)}
function nearest(c,x,y,z,r){const gx=Math.floor(x/DI),gy=Math.floor(y/DI),gz=Math.floor(z/DI);let b=-1,bd=r*r;
 for(let i=-1;i<2;i++)for(let j=-1;j<2;j++)for(let k=-1;k<2;k++){const l=c.g.get(key(gx+i,gy+j,gz+k));if(l)for(const n of l){
  const dx=N4[n*4]-x,dy=N4[n*4+1]-y,dz=N4[n*4+2]-z,d=dx*dx+dy*dy+dz*dz;if(d<bd){bd=d;b=n}}}return[b,bd]}
function grow(c){const ac=new Map(),a=c.a;
 for(let i=0;i<a.length;i+=3){if(a[i+1]<-50)continue;const[n,d2]=nearest(c,a[i],a[i+1],a[i+2],DI);if(n<0)continue;
  if(d2<DK*DK){a[i+1]=-99;c.left--;continue}const d=Math.sqrt(d2);let v=ac.get(n);if(!v)ac.set(n,v=[0,0,0]);
  v[0]+=(a[i]-N4[n*4])/d;v[1]+=(a[i+1]-N4[n*4+1])/d;v[2]+=(a[i+2]-N4[n*4+2])/d}
 let k=0;for(const[n,v]of ac){v[1]+=c.up*Math.hypot(...v);const l=Math.hypot(...v)||1,x=N4[n*4]+v[0]/l*D,z=N4[n*4+2]+v[2]/l*D,y=Math.max(sb(x,z)+.05,N4[n*4+1]+v[1]/l*D);
  if(nearest(c,x,y,z,D*.5)[0]>=0)continue;addNode(c,x,y,z,n);k++}
 c.idle=k?0:c.idle+1;if(c.idle>6||c.left<=0){c.done=1;c.g=null;c.a=null}}
function colony(x,z){const r=rnd,t=r()*5|0,by=sb(x,z),R=1.2+r()*2.6,near=Math.abs(z-pz(x))<6,top=near?2.3:9,a=[],
 add=(px,py,pz_)=>{if(py<top&&py>.05)a.push(x+px,by+py,z+pz_)},U=()=>r()*2-1;
 for(let i=0;i<40;i++)add(U()*.6,r()*.7+.1,U()*.6);
 const n=Math.min(1600,300+R*300),fa=r()*Math.PI;let g=0;
 while(a.length<n*3&&g++<20000){
  if(t==0){const p=[U()*R,r()*1.4*R,U()*R];if(p[0]**2+p[2]**2+(p[1]/1.4)**2<R*R)add(...p)}
  else if(t==1){const th=fa,u=U()*R*1.2,v=r()*2.3*R,w=U()*.07;if((u/R/1.2)**2+((v-1.15*R)/(1.15*R))**2<1)add(u*Math.cos(th)-w*Math.sin(th),v+.2,u*Math.sin(th)+w*Math.cos(th))}
  else if(t==2){const hh=.9+R*.5;if(r()<.15)add(U()*.25,r()*hh,U()*.25);else{const q=Math.sqrt(r())*R*1.4,an=r()*6.28;add(q*Math.cos(an),hh+r()*.35,q*Math.sin(an))}}
  else if(t==3){const k=g%5,an=k*2.4+R,q=.4+k*.25*R/2,hh=1.4+(k*.37%1)*R*1.4;add(q*Math.cos(an)+U()*.35,r()*hh,q*Math.sin(an)+U()*.35)}
  else{const p=[U(),U(),U()],l=Math.hypot(...p)||1;if(r()<.12)add(U()*.2,r()*R*.6,U()*.2);else if(p[1]/l>-.4)add(p[0]/l*R,p[1]/l*R+R*.75,p[2]/l*R)}}
 const c={nt:0,id:cols.length,a:new Float32Array(a),left:a.length/3,g:new Map(),up:[.3,0,.15,.55,0][t],rs:[1,.55,.85,1.15,.7][t],ci:r()*5|0,hr:r(),idle:0,mx:x,done:0};
 cols.push(c);addNode(c,x,by-.05,z,-1)}
function spawn(to){while(spawnX<to){for(let i=0;i<9;i++){const x=spawnX+rnd()*3,z=pz(spawnX)+(rnd()-.5)*80,
 p=.5+.5*Math.sin(x*.045+Math.sin(z*.05)*2)*Math.sin(z*.07+x*.02+ph);if(rnd()<p*p*.9)colony(x,z)}spawnX+=3}}
function compact(cx){const m=new Int32Array(cnt).fill(-1);let k=0;for(let i=0;i<cnt;i++)if(N4[i*4]>cx-16)m[i]=k++;
 for(let i=0;i<cnt;i++)if(m[i]>=0&&m[i]!=i){const j=m[i];N4.copyWithin(j*4,i*4,i*4+4);A4.copyWithin(j*4,i*4,i*4+4);DSC[j]=DSC[i];COL[j]=COL[i]}
 for(let i=0;i<k;i++){const p=A4[i*4];A4[i*4]=p>=0?m[p]:-1}cnt=k;
 cols=cols.filter(c=>!c.done||c.mx>cx-16);const by=new Map(cols.map((c,i)=>(c.g&&(c.g=new Map()),[c.id,c])));
 for(let i=0;i<k;i++){const c=by.get(COL[i]);if(c&&c.g){const x=N4[i*4],y=N4[i*4+1],z=N4[i*4+2],q=key(Math.floor(x/DI),Math.floor(y/DI),Math.floor(z/DI));let l=c.g.get(q);if(!l)c.g.set(q,l=[]);l.push(i)}}
 dirty=0;auxDirty=1}

// --- worlds ---------------------------------------------------------------------------
const WAT=[[[.3,.72,.78],[.01,.13,.2],[.86,.8,.66]],[[.16,.4,.68],[.01,.04,.13],[.75,.75,.72]],[[.38,.62,.46],[.02,.1,.08],[.8,.76,.6]],[[.46,.42,.72],[.04,.03,.12],[.8,.72,.7]],[[.4,.64,.76],[.03,.13,.24],[.92,.88,.8]]];
const COR=[[[.95,.42,.38],[.98,.8,.58],[.72,.32,.6],[.92,.6,.24],[.3,.68,.7]],[[.92,.9,.84],[.86,.68,.64],[.62,.66,.78],[.88,.8,.6],[.7,.5,.62]],
 [[.6,.3,.75],[.95,.75,.3],[.95,.5,.6],[.4,.5,.9],[.98,.92,.8]],[[.95,.55,.2],[.85,.25,.2],[.98,.85,.55],[.55,.35,.2],[.9,.7,.6]],[[.35,.8,.7],[.2,.55,.75],[.9,.95,.85],[.6,.85,.4],[.95,.6,.55]]];
let seed,wat,cor,camX,fade=0,ph=0;
function rng(a){return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function world(s){seed=s??(Math.random()*1e9|0);history.replaceState(0,'','#'+seed);rnd=rng(seed);
 wat=WAT[rnd()*WAT.length|0];ph=rnd()*7;cor=COR[rnd()*COR.length|0];cnt=0;cols=[];camX=rnd()*500|0;spawnX=camX-12;acc=0;fade=0;spawn(camX+50)}
world(location.hash.length>1?+location.hash.slice(1):undefined);

let lx=0,ly=0,tx=0,ty=0,drag=null,last=0,fr=0;
C.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,m:0};C.setPointerCapture(e.pointerId)};
C.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.m+=Math.abs(dx)+Math.abs(dy);drag.x=e.clientX;drag.y=e.clientY;tx-=dx*.004;ty=Math.max(-.8,Math.min(.8,ty-dy*.004))};

const norm=v=>{const l=Math.hypot(...v);return v.map(x=>x/l)},cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
